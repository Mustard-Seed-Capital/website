}

/* ---------- create, join, waiting room ---------- */
function crewSheet(prefill){
  let mode='classic', target=300, nmv=PROFILE.name&&PROFILE.name!=='You'?PROFILE.name:'';
  const v=sheet('<div id="crew"></div>',{mid:true});
  const draw=()=>{
    v.querySelector('#crew').innerHTML=`
      <h2>Play with your crew</h2>
      <p class="lede">Start a private table and text the code to your friends. Empty seats get bots, so you can start with just two of you.</p>
      <h4>Your name at the table</h4>
      <input id="cName" class="nameIn" maxlength="14" placeholder="Your name" autocomplete="nickname" value="${esc(nmv)}" aria-label="Your name">
      <h4>Join a friend’s table</h4>
      <div class="joinrow"><input id="cCode" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(prefill||'')}" aria-label="Table code"><button class="btn" id="cJoin">Join</button></div>
      <h4>Or start a new table</h4>
      <div class="seg tseg">${[['classic','Classic'],['jjdd','JJDD'],['ffa','Free-for-All']].map(([m,l])=>`<label><input type="radio" name="cm" value="${m}" ${m===mode?'checked':''}><span>${l}</span></label>`).join('')}</div>
      ${mode==='ffa'?'':`<div class="seg tseg" style="margin-top:8px">${[100,300,500].map(t=>`<label><input type="radio" name="ct" value="${t}" ${t===target?'checked':''}><span>To ${t}</span></label>`).join('')}</div>`}
      <button class="btn" id="cNew" style="margin-top:12px">Create table</button>
      <p class="fine">Your house rules from the Rules screen apply. Online tables are free and you still earn XP and coins.</p>`;
    v.querySelectorAll('input[name="cm"]').forEach(i=>i.onchange=()=>{mode=i.value;draw();});
    v.querySelectorAll('input[name="ct"]').forEach(i=>i.onchange=()=>{target=+i.value;});
    const nm=v.querySelector('#cName'); nm.oninput=()=>{nmv=nm.value;};
    const named=()=>{const n=nm.value.trim().replace(/\s+/g,' '); if(!n){toast('Add your name so friends know who’s who.');nm.focus();return false;} PROFILE.name=n.slice(0,14); saveProfile(); renderMe(); return true;};
    const code=v.querySelector('#cCode'); code.oninput=()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'');};
    v.querySelector('#cJoin').onclick=async e=>{const c=code.value.trim(); if(c.length!==5){toast('Codes are 5 letters and numbers.');return;} if(!named()) return;
      e.target.disabled=true; e.target.textContent='Joining…'; const ok=await joinTable(c); if(ok) v.remove(); else {e.target.disabled=false;e.target.textContent='Join';}};
    v.querySelector('#cNew').onclick=async e=>{if(!named()) return; e.target.disabled=true; e.target.textContent='Creating…';
      const ok=await createTable(mode,mode==='ffa'?100:target); if(ok) v.remove(); else {e.target.disabled=false;e.target.textContent='Create table';}};
  };
  draw();
}
async function connect(){
  try{ await fb(); return true; }
  catch(e){ console.warn(e); toast('Couldn’t reach the game server. Check your internet and try again.',3600); return false; }
}
async function createTable(mode,target){
  if(!await connect()) return false;
  const {F,db}=FB;
  try{
    let code='';
    for(let i=0;i<6;i++){code=Array.from({length:5},()=>CODE_AB[Math.floor(Math.random()*CODE_AB.length)]).join('');
      if(!(await F.getDoc(F.doc(db,'tables',code))).exists()) break;}
    const rules={jokers:!!opts.jokers,deuce:!!opts.deuce,nil:!!opts.nil,bags:!!opts.bags,timer:!!opts.timer,blind:!!opts.blind};
    await F.setDoc(F.doc(db,'tables',code),{host:FB.uid,status:'lobby',mode,target,rules,g:0,bots:[],created:F.serverTimestamp()});
    ONL.code=code; ONL.host=true; ONL.me=0;
    await F.setDoc(tRef('seats','0'),mySeatInfo());
    enterRoom(); return true;
  }catch(e){console.warn(e); toast('Couldn’t create the table. Try again.',3000); ONL.code=null; return false;}
}
async function joinTable(code){
  if(!await connect()) return false;
  const {F,db}=FB;
  try{
    const s=await F.getDoc(F.doc(db,'tables',code));
    if(!s.exists()){toast('No table with that code. Check it and try again.',3200);return false;}
    const d=s.data();
    if(d.status==='playing') return rejoinTable(code,true);
    if(d.status!=='lobby'){toast('That table closed. Ask for a new code.',3200);return false;}
    ONL.code=code; ONL.host=d.host===FB.uid; ONL.me=-1;
    enterRoom(); return true;
  }catch(e){console.warn(e); toast('Couldn’t join. Try again.',3000); ONL.code=null; return false;}
}
function onlineUnsub(){ONL.unsubs.forEach(u=>{try{u();}catch(e){}}); ONL.unsubs=[];}
function enterRoom(quiet){
  const {F,db}=FB; onlineUnsub();
  if(!quiet){ ONL.seats=[null,null,null,null]; ONL.gone=new Set(); ONL.table=null;
    const v=sheet('<div id="room"></div>',{mid:true,noClose:true}); ONL.room=v; }
  ONL.unsubs.push(F.onSnapshot(F.collection(db,'tables',ONL.code,'seats'),snap=>{
    const seats=[null,null,null,null];
    snap.forEach(d=>{const x=d.data(), i=+d.id; if(i>=0&&i<4) seats[i]={uid:x.uid,name:String(x.name||'Player').slice(0,14),av:cleanAv(x.av),lvl:Math.max(1,Math.min(99,x.lvl|0)),rk:Math.max(0,Math.min(RANKS.length-1,x.rk|0))};});
    if(ONL.on){ for(let a=0;a<4;a++) if(ONL.seats[a]&&!seats[a]) leftIn(a); return; }
    ONL.seats=seats; ONL.me=seats.findIndex(x=>x&&x.uid===FB.uid); if(ONL.spec&&ONL.me<0) ONL.me=0; drawRoom();
  },e=>console.warn(e)));
  ONL.unsubs.push(F.onSnapshot(tRef(),s=>{
    if(!s.exists()) return;
    const d=s.data(), was=ONL.table; ONL.table=d;
    if(d.status==='playing'&&!ONL.on){
      if(ONL.me<0&&!ONL.spec){toast('The game started before you picked a seat.',3600); roomLeave(); return;}
      return beginOnline();
    }
    if(d.status==='closed'&&!ONL.host){toast('The host closed the table.',3200); if(ONL.on){onlineLeave(false);openLobby();} else roomLeave(); return;}
    if(ONL.on&&d.g!==ONL.g){ONL.g=d.g; onlineNewGame();}
    if(!ONL.on&&!was) drawRoom();
  },e=>console.warn(e)));
}
function drawRoom(){
  const v=ONL.room; if(!v||!ONL.table&&!ONL.host) {if(v) v.querySelector('#room').innerHTML='<p class="lede">Connecting…</p>'; return;}
  const t=ONL.table||{mode:'classic',target:300}, P=t.mode!=='ffa', link=`${location.origin}${location.pathname}?t=${ONL.code}`;
  const seat=a=>{const s=ONL.seats[a], me=a===ONL.me;
    return `<div class="rs ${s?'on':''} ${me?'me':''}">${s?`<div class="mini">${avatarSVG(s.av)}</div><b>${esc(s.name)}${me?' (you)':''}</b><small>${a===0?'Host · ':''}Lv ${s.lvl}</small>`
      :`<div class="mini empty">🤖</div><b>Open seat</b><small>${ONL.me<0?`<button class="sit" data-a="${a}">Sit here</button>`:'A bot plays it'}</small>`}</div>`;};
  const humans=ONL.seats.filter(Boolean).length;
  v.querySelector('#room').innerHTML=`
    <h2>${esc(MODES[t.mode]?MODES[t.mode].name:'Spades')} · to ${t.target}</h2>
    <div class="code-box"><small>Table code</small><b>${ONL.code}</b></div>
    <div class="share-row"><button class="btn" id="rShare">Send invite</button><button class="btn ghost" id="rCopy">Copy link</button></div>
    ${P?`<h4>Team 1</h4><div class="rgrid">${seat(0)}${seat(2)}</div><h4>Team 2</h4><div class="rgrid">${seat(1)}${seat(3)}</div>`
       :`<h4>Seats</h4><div class="rgrid">${[0,1,2,3].map(seat).join('')}</div>`}
    ${ONL.me<0?'<p class="lede" style="margin-top:10px">Pick a seat to sit down.</p>':''}
    ${ONL.host?`<button class="btn" id="rStart" style="margin-top:12px">Start game${humans<4?` · ${4-humans} bot${4-humans>1?'s':''}`:''}</button>`
      :`<p class="lede" style="margin-top:10px">${ONL.me>=0?'You’re in. Waiting on the host to start…':''}</p>`}
    <button class="btn ghost" id="rLeave">${ONL.host?'Close table':'Leave'}</button>`;
  v.querySelectorAll('.sit').forEach(b=>b.onclick=async()=>{b.disabled=true;
    try{await FB.F.setDoc(tRef('seats',b.dataset.a),mySeatInfo());}catch(e){toast('Someone just took that seat.');b.disabled=false;}});
  const invite=`Pull up to my Spades table on Bags & Books. Code ${ONL.code}: ${link}`;
  v.querySelector('#rShare').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Bags & Books',text:invite});return;}}catch(e){return;} copyText(invite);};
  v.querySelector('#rCopy').onclick=()=>copyText(link);
  const st=v.querySelector('#rStart'); if(st) st.onclick=async()=>{st.disabled=true;
    try{await FB.F.updateDoc(tRef(),{status:'playing',bots:[0,1,2,3].filter(a=>!ONL.seats[a])});}catch(e){console.warn(e);toast('Couldn’t start. Try again.');st.disabled=false;}};
  v.querySelector('#rLeave').onclick=()=>roomLeave(true);
}
function copyText(t){
  const done=()=>toast('Copied. Paste it in a text to your friends.',2600);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>prompt('Copy this:',t)); else prompt('Copy this:',t);
}
async function rejoinTable(code,watch){
  if(!await connect()) return false;
  const {F,db}=FB;
  try{
    const s=await F.getDoc(F.doc(db,'tables',code));
    if(!s.exists()||s.data().status!=='playing'){onlForget(); if(watch) toast('That game is over. Ask for a new code.',3000); return false;}
    const d=s.data(), ss=await F.getDocs(F.collection(db,'tables',code,'seats')), seats=[null,null,null,null];
    ss.forEach(x=>{const v=x.data(), i=+x.id; if(i>=0&&i<4) seats[i]={uid:v.uid,name:String(v.name||'Player').slice(0,14),av:cleanAv(v.av),lvl:Math.max(1,Math.min(99,v.lvl|0)),rk:Math.max(0,Math.min(RANKS.length-1,v.rk|0))};});
    const me=seats.findIndex(x=>x&&x.uid===FB.uid);
    if(me<0&&!watch){onlForget(); return false;}
    document.querySelectorAll('.veil').forEach(v=>v.remove());
    ONL.code=code; ONL.host=d.host===FB.uid; ONL.spec=me<0; ONL.me=me<0?0:me; ONL.seats=seats; ONL.gone=new Set(); ONL.table=null; ONL.room=null;
    ONL.snd=soundOn; soundOn=false; FF=true; setTimeout(ffEnd,15000);
    enterRoom(true); return true;
  }catch(e){console.warn(e); FF=false; soundOn=ONL.snd; toast('Couldn’t get back to that table.',3000); return false;}
}
function onlRemember(){try{localStorage.setItem('bb-online',JSON.stringify({code:ONL.code,at:Date.now()}));}catch(e){}}
function onlForget(){try{localStorage.removeItem('bb-online');}catch(e){}}
function onlKey(){return `${ONL.code}.${ONL.g}.${G.handNo}`;}
function onlCredited(){try{return (JSON.parse(localStorage.getItem('bb-onl-cred')||'[]')).includes(onlKey());}catch(e){return false;}}
function onlCredit(){try{const a=JSON.parse(localStorage.getItem('bb-onl-cred')||'[]'); a.push(onlKey()); localStorage.setItem('bb-onl-cred',JSON.stringify(a.slice(-80)));}catch(e){}}
function roomLeave(byUser){
  const {F}=FB||{};
  if(F&&ONL.code){
    if(ONL.host&&byUser) F.updateDoc(tRef(),{status:'closed'}).catch(()=>{});
    else if(ONL.me>=0) F.deleteDoc(tRef('seats',String(ONL.me))).catch(()=>{});
  }
  onlineUnsub(); if(ONL.room){ONL.room.remove(); ONL.room=null;} ONL.code=null; ONL.me=0; ONL.host=false; ONL.spec=false; onlForget();
}
function beginOnline(){
  const d=ONL.table, {F,db}=FB;
  if(ONL.room){ONL.room.remove(); ONL.room=null;}
  ONL.saved=Object.assign({},opts); Object.assign(opts,d.rules||{},{mode:d.mode,target:d.target});
  ONL.on=true; ONL.g=d.g||0; ONL.ev={}; ONL.myHands={}; ONL.gone=new Set(); ONL.miss={}; ONL.advanced=null;
  (d.bots||[]).forEach(a=>{ONL.seats[a]=null;});
  if(!ONL.spec) onlRemember();
  if(!ONL.spec) ONL.unsubs.push(F.onSnapshot(F.query(F.collection(db,'tables',ONL.code,'hands'),F.where('uid','==',FB.uid)),snap=>{
    snap.forEach(x=>{ONL.myHands[x.id]=x.data().cards;}); if(ONL.handWait) ONL.handWait();
  },e=>console.warn(e)));
  ONL.unsubs.push(F.onSnapshot(F.collection(db,'tables',ONL.code,'ev'),snap=>{
    snap.docChanges().forEach(ch=>{if(ch.type!=='added') return; const id=ch.doc.id, x=ch.doc.data(); if(ONL.ev[id]) return; ONL.ev[id]=x; onEv(id,x);});
  },e=>{console.warn(e); toast('Lost the connection to the table.',3000);}));
  const lb=document.getElementById('lobby'); if(lb) lb.hidden=true;
  renderMe(); onlineNewGame(); specTag();
  const bots=4-ONL.seats.filter(Boolean).length;
  if(ONL.spec){toast(`Watching table ${ONL.code}. You see every play, but nobody’s cards.`,3400); return;}
  if(FF) return;
  toast(bots?`Table ${ONL.code} · ${bots} bot${bots>1?'s':''} fill the empty seats 🤖`:`Table ${ONL.code} · full table. Good luck!`,3000);
}
function specTag(){
  let t=document.getElementById('specTag');
  if(!ONL.on||!ONL.spec){if(t) t.remove(); return;}
  if(!t){t=document.createElement('div'); t.id='specTag'; stage.appendChild(t);}
  t.innerHTML=`👀 Watching · bottom seat is ${esc(ONL.seats[0]?ONL.seats[0].name:'the host')}`;
}
function onlineLeave(announce){
  if(ONL.on&&announce&&ONL.me>=0){ if(ONL.host) FB.F.updateDoc(tRef(),{status:'closed'}).catch(()=>{}); else post('left.'+ONL.me,{s:ONL.me}); }
  onlineUnsub(); if(ONL.room){ONL.room.remove(); ONL.room=null;}
  ONL.on=false; ONL.code=null; ONL.tok++; if(FF){FF=false; soundOn=ONL.snd;} ONL.spec=false; specTag(); onlForget(); ONL.wait=null; ONL.watch=null; ONL.watchDeal=null; ONL.handWait=null; clearTimeout(ONL.fbT); ONL.me=0; ONL.host=false;
  if(ONL.saved){Object.assign(opts,ONL.saved); ONL.saved=null;}
  NAMES[2]='Nae'; $('#pic2').innerHTML=avatarSVG(BOT_AV[2]);
  clearTimers(); stopClock(); clearTrick(true); $('#votePanel').hidden=true; $('#bidPanel').hidden=true;
  document.querySelectorAll('.veil').forEach(v=>v.remove());
  G=newGameState(); dealHand(); G.phase='idle'; setOpps(0); renderSeats(); renderHand(); status('');
}
/* invite links: ?t=CODE opens the join screen */
/* and if you were mid-game when the page closed, you go right back to your seat */
{const qc=(new URLSearchParams(location.search).get('t')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
 let saved=null; try{saved=JSON.parse(localStorage.getItem('bb-online')||'null');}catch(e){}
 if(saved&&saved.code&&Date.now()-saved.at<3*3600e3&&(!qc||qc===saved.code)) setTimeout(()=>{toast('Getting you back to your table…',2000); rejoinTable(saved.code,false).then(ok=>{if(!ok&&qc) crewSheet(qc);});},700);
 else if(qc) setTimeout(()=>{if(!document.querySelector('.veil')) crewSheet(qc);},700);}
</script>
