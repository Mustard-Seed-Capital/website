<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bags & Books">
<meta name="theme-color" content="#0e2219">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}html,body{-webkit-text-size-adjust:100%;overscroll-behavior:none}</style>
</head>
<body>
<title>Bags &amp; Books</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;1,6..96,600&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen card room. Score rail on top, oval felt table with a wood rail, your hand fanned along the bottom edge. Single deliberate dark look (it's a card room). */
:root{
  --felt:#16573a;
  --felt-hi:#22774f;
  --felt-deep:#0b2c1f;
  --rail:#4a2c19;
  --rail-dark:#24130a;
  --brass:#d6b062;
  --brass-dim:#8f7442;
  --ink:#f2ecdd;
  --muted:#a8c0b2;
  --panel:#0e271d;
  --panel-line:#2a4a3b;
  --card:#fbf8f1;
  --card-edge:#d9d2c3;
  --card-red:#b3202d;
  --card-black:#16161b;
  --back-a:#7c1c27;
  --back-b:#94283a;
  --good:#7fd39b;
  --bad:#ff8b7b;
  --f-display:'Bodoni Moda', Didot, 'Bodoni 72', 'Times New Roman', serif;
  --f-ui:'Barlow Semi Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --noise:none;
  --tcw:58px;
  /* theme-driven (Card Room defaults; JS swaps these per table theme) */
  --page:#0b2c1f;
  --page-hi:#123b2a;
  --chip:#16352a;
  --wood:#8a5a2e;
  --stitch:rgba(232,206,160,.28);
  --line:rgba(214,176,98,.30);
  --felt-bg:radial-gradient(ellipse at 50% 40%, #2a8a5b 0%, #17603f 45%, #0c3a26 100%);
  --rail-bg:radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.12), transparent 60%), linear-gradient(180deg,#3a2117,#1f110b);
  color-scheme:dark;
}
html,body{height:100%}
@supports (height:100svh){html,body{height:100svh}}
body{
  background:var(--page);
  background-image:var(--noise), radial-gradient(ellipse at 50% 0%, var(--page-hi) 0%, var(--page) 70%);
  transition:background-color .4s;
  color:var(--ink); font-family:var(--f-ui); font-size:15px;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}

#app{
  height:100%; max-width:760px; margin:0 auto; box-sizing:border-box;
  display:grid; grid-template-rows:auto 1fr;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:6px 4px;
}

/* ---------- score rail ---------- */
#bar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding-block:4px 8px}
.team{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;min-width:0}
.team.them{text-align:right;grid-template-columns:1fr auto}
.team .lbl{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--brass)}
.team.them .lbl{order:2}
.team b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2}
.team.them b{order:1;grid-column:1}
.team .det{font-size:12px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.team.them .det{grid-column:1;order:3}
.team.us b{grid-column:1;grid-row:1 / span 2}
.team.us .lbl,.team.us .det{grid-column:2}
.team.them .lbl,.team.them .det{grid-column:1}
.team.them b{grid-column:2;grid-row:1 / span 2}
.tools{display:flex;gap:6px}
.tools button{width:36px;height:36px;border-radius:50%;border:1px solid var(--brass-dim);background:rgba(0,0,0,.25);display:grid;place-items:center;padding:0}
.tools button svg{width:18px;height:18px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools button:active{transform:scale(.94)}

/* ---------- stage / table ---------- */
#stage{position:relative;display:grid;grid-template-rows:1fr auto;min-height:0}
/* padded leather bumper → stitched seam → wood trim → felt with lamp light and a printed racetrack line */
.rail{
  position:relative;min-height:0;border-radius:38% / 20%;padding:15px;
  background:var(--rail-bg);
  box-shadow:0 18px 40px rgba(0,0,0,.6), 0 2px 0 rgba(0,0,0,.4), inset 0 2px 1px rgba(255,255,255,.16), inset 0 -4px 8px rgba(0,0,0,.5);
}
.rail::before{content:"";position:absolute;inset:6px;border-radius:37.5% / 19.6%;border:1.5px dashed var(--stitch);pointer-events:none}
#felt{
  position:relative;height:100%;border-radius:36% / 18.5%;overflow:hidden;
  background:var(--noise), var(--felt-bg);
  box-shadow:0 0 0 3px var(--wood), 0 0 0 4.5px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06), inset 0 0 70px rgba(0,0,0,.6), inset 0 6px 14px rgba(0,0,0,.45);
}
#felt::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 65% 45% at 50% 42%, rgba(255,244,214,.13), transparent 70%)}
#felt::after{content:"";position:absolute;inset:8% 10%;border-radius:34% / 18%;pointer-events:none;
  border:1.5px solid var(--line);outline:1px solid var(--line);outline-offset:5px;opacity:.85}
.mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mark div{text-align:center;color:rgba(242,236,221,.08);font-family:var(--f-display);line-height:1}
.mark .sp{font-size:64px}
.mark .wm{font-size:clamp(12px,3.4vw,20px);letter-spacing:.3em;font-weight:700;margin-top:4px}

/* seats */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;width:84px}
.seat.n{top:12px;left:50%;transform:translateX(-50%)}
.seat.w{left:4px;top:50%;transform:translateY(-62%)}
.seat.e{right:4px;top:50%;transform:translateY(-62%)}
.seat.s{bottom:8px;left:50%;transform:translateX(-50%);flex-direction:column;width:auto;gap:3px}
.av{position:relative;width:48px;height:48px;border-radius:50%;flex:none;
  border:2px solid var(--brass-dim);box-shadow:0 4px 10px rgba(0,0,0,.45);
  transition:box-shadow .3s,border-color .3s}
.pic{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%, var(--chip), var(--panel))}
.pic svg{display:block;width:100%;height:100%}
.seat.s .av{width:50px;height:50px;border-width:3px;border-color:var(--tier,#b9773f);cursor:pointer}
.ring{position:absolute;left:-7px;top:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .2s;z-index:1}
.ring.run{opacity:1}
.ring circle{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0}
.ring.low circle{stroke:#ff6b5b}
.av .cnt,.av .dlr,.av .lv{z-index:2}
#bidSec{color:var(--brass);font-variant-numeric:tabular-nums}
#bidSec.low{color:#ff6b5b}
.av .lv,.big .lv{position:absolute;right:-7px;bottom:-5px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;box-sizing:border-box;
  font:700 11px/20px var(--f-ui);text-align:center;background:var(--tier,#b9773f);color:#16110a;border:1.5px solid rgba(0,0,0,.5)}
.seat.s.hot .av{animation:hot 1.8s ease-in-out infinite}
@keyframes hot{0%,100%{box-shadow:0 0 0 2px rgba(255,140,60,.35),0 0 14px rgba(255,120,40,.5)}50%{box-shadow:0 0 0 4px rgba(255,170,70,.45),0 0 24px rgba(255,120,40,.75)}}
.me-nm{font-weight:700;font-size:13.5px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.boost{font-size:11px;font-weight:700;color:#ffb36b;background:rgba(0,0,0,.35);border-radius:8px;padding:0 6px}
.xpf{position:absolute;z-index:30;font:700 18px var(--f-ui);color:var(--brass);text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;
  transform:translate(-50%,-50%);animation:xpup 1.6s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.seat.active .av{border-color:var(--brass);box-shadow:0 0 0 4px rgba(214,176,98,.25),0 0 18px rgba(214,176,98,.55)}
.av .cnt{position:absolute;right:-8px;bottom:-4px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;box-sizing:border-box;
  font:600 11px/18px var(--f-ui);background:var(--back-a);border:1px solid var(--brass-dim);color:var(--ink);font-variant-numeric:tabular-nums}
.av .dlr{position:absolute;left:-7px;top:-5px;width:17px;height:17px;border-radius:50%;background:var(--card);color:var(--card-black);font:700 10px/17px var(--f-ui);display:none}
.seat.dealer .dlr{display:block}
.av .gift{position:absolute;left:-10px;bottom:-6px;z-index:3;width:24px;height:24px;border-radius:50%;padding:0;border:1.5px solid var(--brass);background:#2a1d0c;font-size:13px;line-height:21px;text-align:center;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.av .gift:active{transform:scale(.9)}
@media (max-height:430px){.av .gift{width:21px;height:21px;font-size:11px;line-height:18px;left:-9px}}
.nm{font-weight:600;font-size:13px;white-space:nowrap}
.nm i{font-style:normal;color:var(--brass);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block;text-align:center;margin-top:-2px}
.ch{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;background:rgba(0,0,0,.28);border-radius:10px;padding:1px 8px}
.ch b{color:var(--ink);font-weight:600}
.ch.nil b{color:var(--brass)}
.seat.s .info{display:flex;flex-direction:column;align-items:center;gap:2px}

/* speech bubbles */
.bub{position:absolute;z-index:20;max-width:150px;width:max-content;padding:6px 10px;border-radius:12px;background:var(--card);color:var(--card-black);
  font:600 13px/1.25 var(--f-ui);box-shadow:0 6px 16px rgba(0,0,0,.4);opacity:0;transform:scale(.85);transition:opacity .2s, transform .2s;pointer-events:none}
.bub.on{opacity:1;transform:scale(1)}
.seat.n .bub{top:100%;left:50%;translate:-50% 6px}
.seat.w .bub{top:100%;left:6px;translate:0 6px}
.seat.e .bub{top:100%;right:6px;translate:0 6px}
.seat.s .bub{bottom:100%;left:50%;translate:-50% -8px}

/* bid panel */
#votePanel{position:absolute;z-index:16;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px, 84%);
  background:rgba(8,20,16,.94);border:1px solid #ff8a3a;border-radius:16px;padding:14px;box-sizing:border-box;text-align:center;
  box-shadow:0 0 0 3px rgba(255,120,40,.18),0 18px 40px rgba(0,0,0,.55);animation:rise .25s both}
#votePanel h3{margin:2px 0 0;font:700 21px/1.15 var(--f-display)}
#votePanel .sub{color:var(--muted);font-size:13px;margin:4px 0 10px;line-height:1.35}
.vp-k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#ffb36b}
.vp-votes{display:flex;justify-content:center;gap:10px}
.vp-v{display:grid;justify-items:center;gap:3px;width:74px}
.vp-v .mini{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--chip);border:2px solid var(--panel-line)}
.vp-v .mini svg{width:100%;height:100%;display:block}
.vp-v b{font-size:12px;font-weight:600;white-space:nowrap}
.vp-v span{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.vp-v.yes .mini{border-color:#6fd38f}.vp-v.yes span{color:#6fd38f}
.vp-v.no .mini{border-color:#ff7b6b}.vp-v.no span{color:#ff7b6b}
.vp-v.pop{animation:vpop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes vpop{0%{transform:scale(.7)}100%{transform:none}}
.vp-act{display:flex;gap:8px;margin-top:12px}
.vp-act button{flex:1;height:42px;border-radius:12px;border:1px solid var(--panel-line);background:var(--chip);font-weight:800;font-size:14px;letter-spacing:.04em}
.vp-act .go{background:linear-gradient(180deg,#ffb36b,#ff7a1a);color:#2a0f00;border:0}
.vp-act .deny{color:#ff8b7b;border-color:rgba(255,139,123,.5)}
.vp-res{margin-top:10px;font:800 18px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.vp-res.ok{color:#ffb36b}.vp-res.no{color:#ff7b6b}
#bidPanel{position:absolute;z-index:15;left:50%;top:var(--cy,50%);transform:translate(-50%,-50%);width:min(292px, 78%);
  background:rgba(8,28,20,.92);border:1px solid var(--brass-dim);border-radius:16px;padding:14px;box-sizing:border-box;
  box-shadow:0 18px 40px rgba(0,0,0,.5);backdrop-filter:blur(4px)}
#bidPanel h3{margin:0;font:700 22px/1.1 var(--f-display);text-align:center}
#bidPanel .sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 10px;min-height:1.2em}
.bids{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bids button{height:38px;border-radius:9px;border:1px solid var(--panel-line);background:#16352a;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.bids button.nil{grid-column:span 2;color:var(--brass);letter-spacing:.08em}
.bids button.sug{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.bids button:active{background:#22503e}
.bids button:disabled{opacity:.3}
.coach{margin-top:10px;text-align:center;font-size:12.5px;color:var(--muted)}
.coach b{color:var(--brass)}

#status{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);z-index:4;font-size:13px;font-weight:600;letter-spacing:.06em;
  color:var(--brass);text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}

/* ---------- cards ---------- */
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:calc(var(--cw) * .085);box-sizing:border-box;
  background:linear-gradient(180deg,var(--card-hi,#fffdf8),var(--card));border:1px solid var(--card-edge);
  box-shadow:0 1px 1px rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.35);color:var(--card-black);font-family:var(--f-display);overflow:hidden}
.card.red{color:var(--card-red)}
.card .idx{position:absolute;top:3.5%;left:5%;width:20%;display:flex;flex-direction:column;align-items:center;line-height:.86;font-weight:700;font-size:calc(var(--cw) * .25);letter-spacing:-.04em}
.card .idx span{font-size:.82em;margin-top:1px}
.card .idx.b{top:auto;left:auto;bottom:3.5%;right:5%;transform:rotate(180deg)}
.card .pp{position:absolute;font-size:calc(var(--cw) * .2);line-height:1;transform:translate(-50%,-50%);font-family:var(--f-ui)}
.card .pp.f{transform:translate(-50%,-50%) rotate(180deg)}
.card .ace{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cw) * .5);line-height:1;font-family:var(--f-ui)}
.card .ace.big{font-size:calc(var(--cw) * .72)}
.card .face{position:absolute;inset:15% 20%;border:1.5px solid currentColor;border-radius:3px;display:grid;place-items:center;
  background:repeating-linear-gradient(45deg, rgba(0,0,0,.035) 0 3px, transparent 3px 6px)}
.card .face em{font-style:italic;font-weight:600;font-size:calc(var(--cw) * .42);line-height:1}
.card .face s{text-decoration:none;position:absolute;font-family:var(--f-ui);font-size:calc(var(--cw) * .16);top:6%;right:9%}
.card .face s+s{top:auto;right:auto;bottom:6%;left:9%;transform:rotate(180deg)}
.card.joker .jk{position:absolute;inset:0;display:grid;place-items:center}
.card.joker .jk div{writing-mode:vertical-rl;font-weight:700;letter-spacing:.12em;font-size:calc(var(--cw) * .17)}
.card.joker .star{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:calc(var(--cw) * .5);opacity:.18;font-family:var(--f-ui)}
.card.back{background:
  radial-gradient(circle at 50% 50%, transparent 0 18%, rgba(0,0,0,.0) 18%),
  repeating-linear-gradient(45deg, var(--back-a) 0 4px, var(--back-b) 4px 8px),
  repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 4px, transparent 4px 8px);
  background-blend-mode:normal, normal, multiply;
  box-shadow:inset 0 0 0 3px var(--card), inset 0 0 0 4.5px var(--brass), 0 3px 8px rgba(0,0,0,.35)}

/* hand */
#hand{position:relative;z-index:5;--cw:68px;margin-top:4px}
#hand .card{transition:transform .18s ease, filter .2s;cursor:pointer}
#hand .card.up{transform:translateY(-16px)}
#hand .card.dim{filter:brightness(.62) saturate(.7)}
#hand .card.playable:not(.up){transform:translateY(-4px)}
#hand .card.deal{animation:dealin .38s cubic-bezier(.2,.8,.25,1) both}
@keyframes dealin{from{opacity:0;transform:translateY(-120px) rotate(-8deg) scale(.7)}to{opacity:1;transform:none}}
.tc{--cw:var(--tcw);z-index:6;will-change:transform}

/* sheets */
.veil{position:fixed;inset:0;z-index:50;background:rgba(3,14,9,.62);display:flex;align-items:flex-end;justify-content:center;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));box-sizing:border-box;animation:fade .2s both}
.veil.mid{align-items:center}
@keyframes fade{from{opacity:0}}
.sheet{width:min(460px,100%);max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
  padding:18px 18px 16px;box-sizing:border-box;box-shadow:0 -8px 40px rgba(0,0,0,.5);animation:rise .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sheet h2{margin:0 0 2px;font:700 26px/1.1 var(--f-display);text-wrap:balance}
.sheet h2 .sp{color:var(--brass)}
.sheet .lede{color:var(--muted);margin:0 0 14px;font-size:14px;line-height:1.4}
.sheet h4{margin:16px 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--panel-line)}
.opt:first-of-type{border-top:0}
.opt .t{font-weight:600;font-size:15px}
.opt .d{font-size:12.5px;color:var(--muted);line-height:1.3}
.sw{position:relative;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{display:block;width:44px;height:26px;border-radius:13px;background:#284235;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw input:checked+span{background:var(--brass-dim)}
.sw input:checked+span::after{transform:translateX(18px);background:var(--brass)}
.seg{display:flex;border:1px solid var(--panel-line);border-radius:10px;overflow:hidden;flex:none}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.seg input:checked+span{background:var(--brass);color:#1c1408}
.btn{display:block;width:100%;margin-top:16px;height:48px;border-radius:12px;border:0;background:var(--brass);color:#1d1407;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;border:1px solid var(--brass-dim);color:var(--brass);margin-top:8px;height:42px;font-size:14px}
.btn:active{transform:scale(.985)}
.close{float:right;background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:2px 4px;margin:-4px -4px 0 0}

/* results table */
.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.res th,.res td{padding:7px 4px;text-align:right;border-top:1px solid var(--panel-line);font-size:14.5px}
.res th:first-child,.res td:first-child{text-align:left;color:var(--muted);font-weight:500}
.res thead th{border-top:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.res .tot td{font-family:var(--f-display);font-weight:700;font-size:20px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.notes{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.notes li::before{content:"♠ ";color:var(--brass)}

/* tracker */
.trk{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px}
.trow .s{font-size:22px;text-align:center}
.trow .s.red{color:#ff7d86}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips i{font-style:normal;min-width:24px;height:26px;padding:0 4px;box-sizing:border-box;border-radius:6px;display:grid;place-items:center;font:700 13px var(--f-display);background:var(--card);color:var(--card-black)}
.chips i.red{color:var(--card-red)}
.chips i.out{background:transparent;color:#4d6a5c;border:1px dashed #33503f;font-weight:600}
.chips i.mine{background:#c9b88f}
.trow .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.last{position:relative;height:96px;margin-top:4px}
.last .card{--cw:52px}

/* quick chat */
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phr button{min-height:44px;border-radius:12px;border:1px solid var(--panel-line);background:#15352a;font-weight:600;font-size:14.5px;padding:6px 10px;text-align:left;line-height:1.2}
.phr button:active{background:#22503e}
.voice{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:12px;border:1px dashed var(--brass-dim)}
.voice svg{flex:none;width:26px;height:26px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.4}
.voice b{color:var(--ink)}

/* XP block in hand results */
.xp{margin-top:14px;padding:12px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--panel-line)}
.xph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xph span{font-weight:600}
.xph b{font:700 20px var(--f-display);color:var(--brass);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width 1s cubic-bezier(.2,.8,.25,1)}
.xpl{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xpl em{font-style:normal;color:var(--ink)}
.lvup{margin-top:10px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,rgba(214,176,98,.25),rgba(214,176,98,.06));border:1px solid var(--brass);font-weight:600;animation:rise .4s .6s both}
.lvup b{color:var(--brass)}

/* player sheet */
.prof{display:flex;gap:14px;align-items:center}
.prof .big{position:relative;width:84px;height:84px;border-radius:50%;border:3px solid var(--tier,#b9773f);flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.prof .big .lv{right:-4px;bottom:-2px;min-width:26px;height:24px;line-height:24px;font-size:13px}
.prof .who{min-width:0;flex:1}
.prof input{width:100%;box-sizing:border-box;height:38px;border-radius:9px;border:1px solid var(--panel-line);background:var(--chip);color:var(--ink);font:600 17px var(--f-ui);padding:0 10px}
.prof .ttl{font-size:13px;color:var(--brass);font-weight:600;margin-top:6px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stats div{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 4px;text-align:center}
.stats b{display:block;font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pk{display:flex;flex-wrap:wrap;gap:6px}
.pk button{min-height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--panel-line);background:var(--chip);font-weight:600;font-size:13.5px}
.pk button.on{border-color:var(--brass);color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.pk button.sw8{width:34px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.4)}
.pk button.sw8.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brass)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.th{position:relative;border:1px solid var(--panel-line);border-radius:12px;padding:8px;background:rgba(0,0,0,.18);text-align:left}
.th.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.th .mini{height:58px;border-radius:50% / 50%;padding:6px;box-sizing:border-box}
.th .mini i{display:block;height:100%;border-radius:50% / 50%;box-shadow:0 0 0 2px var(--twood), inset 0 0 14px rgba(0,0,0,.5)}
.th .nm2{display:block;margin-top:6px;font-weight:600;font-size:14px}
.th .lk{display:block;font-size:11.5px;color:var(--muted)}
.th:disabled{opacity:.55}
.th:disabled .mini{filter:grayscale(.7) brightness(.7)}
.me-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:rgba(0,0,0,.2);margin-bottom:4px}
.me-row .av{width:52px;height:52px;border-width:3px;border-color:var(--tier,#b9773f)}
.me-row .t{font-weight:700;font-size:16px}
.me-row .d{font-size:12.5px;color:var(--muted)}
.me-row button{margin-left:auto;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--brass-dim);background:transparent;color:var(--brass);font-weight:600}

/* ---------- lobby ---------- */
.lobby{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;
  background:var(--page);background-image:var(--noise), radial-gradient(ellipse 90% 45% at 50% 0%, var(--page-hi), var(--page) 75%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none}
.lb-wrap{max-width:560px;margin:0 auto;display:grid;gap:12px;padding-block:12px 6px}
.lb-col{display:grid;gap:12px;align-content:start;min-width:0}
.lb-top{display:flex;align-items:center;gap:12px}
.lb-me{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;flex:1;min-width:0}
.lb-me .av{width:56px;height:56px;border-width:3px;border-color:var(--tier)}
.lb-who{min-width:0;flex:1}
.lb-who b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-who span{font-size:12.5px;color:var(--muted)}
.bar.sm{height:6px;margin:5px 0 0;max-width:190px}
.bar.sm i{transition:none}
.coin-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);border:1px solid var(--brass-dim);border-radius:999px;padding:3px 10px 3px 4px;color:var(--ink);white-space:nowrap}
.coin-pill svg{width:20px;height:20px;flex:none}
.coin-pill.big{font-size:17px;padding:5px 12px 5px 5px}
.coin-pill.big svg{width:26px;height:26px}
.coin-pill .plus{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brass);color:#1c1408;font-size:15px;margin-left:2px}
.rp-pill{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 10px 3px 6px;background:rgba(0,0,0,.3)}
.rp-pill.up{color:var(--good)} .rp-pill.down{color:var(--bad)}
.earn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.lb-rail{border-radius:30px;padding:9px;background:var(--rail-bg);box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.15)}
.lb-hero{position:relative;border-radius:22px;padding:18px 16px 16px;overflow:hidden;background:var(--noise), var(--felt-bg);
  box-shadow:0 0 0 3px var(--wood), inset 0 0 50px rgba(0,0,0,.55)}
.lb-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 30% 20%, rgba(255,244,214,.12), transparent 70%);pointer-events:none}
.lb-fan{position:absolute;right:10px;top:8px;width:120px;height:90px;pointer-events:none}
.lb-fan .card{--cw:46px;left:auto;top:auto;transform-origin:50% 120%}
.brand{position:relative;font:700 30px/1 var(--f-display);text-wrap:balance;max-width:62%}
.brand .sp{color:var(--brass)}
.tag{position:relative;margin:6px 0 14px;color:rgba(242,236,221,.78);font-size:14px;max-width:62%}
.modes{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(0,0,0,.32);padding:10px 6px 8px;display:grid;justify-items:center;gap:1px}
.mode b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.mode span{font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.mode small{font-size:11.5px;color:rgba(242,236,221,.65)}
.mode.on{border-color:var(--brass);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(214,176,98,.18)}
.play{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:12px;border:0;border-radius:16px;
  background:linear-gradient(180deg,#ffe39a,var(--brass) 55%,var(--brass-dim));color:#1d1407;font:800 20px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 6px 0 rgba(0,0,0,.35), 0 10px 22px rgba(0,0,0,.35)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.resume{position:relative;width:100%;height:42px;margin-top:10px;border-radius:12px;border:1px solid var(--brass);background:rgba(0,0,0,.35);color:var(--brass);font-weight:700;letter-spacing:.06em}
.rules-link{position:relative;display:block;margin:10px auto 0;background:none;border:0;color:rgba(242,236,221,.8);font-size:13px;text-decoration:underline;text-underline-offset:3px}

.lb-card{background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.12)), var(--panel);border:1px solid var(--panel-line);border-radius:18px;padding:14px}
.lb-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.lb-h h3{margin:0;font:700 19px/1.1 var(--f-display)}
.lb-h small{font-size:12px;color:var(--muted);text-align:right}
.notice{border-radius:14px;padding:11px 13px;background:linear-gradient(90deg,rgba(255,122,92,.22),rgba(255,122,92,.06));border:1px solid rgba(255,140,110,.5);font-size:14px;line-height:1.35}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pipd{border-radius:10px;padding:6px 2px;text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--panel-line)}
.pipd b{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.pipd span{display:block;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pipd.done{background:linear-gradient(180deg,var(--brass),var(--brass-dim));border-color:transparent;color:#1d1407}
.pipd.done b{color:#3a2a0a}
.pipd.today{border-color:var(--brass);box-shadow:0 0 0 2px rgba(214,176,98,.35);animation:glow 1.6s ease-in-out infinite}
.pipd.big span{color:var(--brass)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(214,176,98,.15),0 0 16px rgba(214,176,98,.35)}}
.claim{width:100%;height:44px;margin-top:10px;border:0;border-radius:12px;background:var(--brass);color:#1d1407;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.claim:disabled{background:rgba(0,0,0,.25);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;border:1px solid var(--panel-line)}
.rk{display:flex;gap:12px;align-items:center}
.rk svg{flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.rk .rn{font:700 21px/1.1 var(--f-display)}
.rk .rp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rk .bar{margin:7px 0 4px}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip2{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:rgba(0,0,0,.28);border:1px solid var(--panel-line)}
.chip2.ok{color:var(--good)} .chip2.warn{color:#ffb36b} .chip2.bad{color:var(--bad)}
.rule{font-size:12.5px;color:var(--muted);line-height:1.4;margin:8px 0 0}
.ms{display:grid;gap:10px}
.m{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.m .mt{font-weight:600;font-size:14.5px}
.m .bar{height:7px;margin:0}
.m .mr{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.m .mr small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.m button{height:32px;padding:0 12px;border-radius:10px;border:0;background:var(--brass);color:#1d1407;font-weight:800;font-size:13px}
.m.done .mt{color:var(--muted);text-decoration:line-through}
.lb-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lb-nav button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--panel-line);background:var(--panel);font-weight:600;font-size:13.5px}
.lb-nav svg{width:24px;height:24px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shop */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:1px solid var(--panel-line);border-radius:14px;padding:10px;background:rgba(0,0,0,.18);display:grid;gap:6px;align-content:start}
.item .pv{height:78px;border-radius:10px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%, var(--chip), rgba(0,0,0,.2))}
.item .pv .av{width:64px;height:64px;border-color:var(--brass-dim)}
.item .pv .talk{background:var(--card);color:var(--card-black);border-radius:12px;padding:6px 9px;font-weight:700;font-size:12.5px;max-width:90%}
.item .pv .mini{width:86%;height:56px;border-radius:50%;padding:5px;box-sizing:border-box}
.item .pv .mini i{display:block;height:100%;border-radius:50%;box-shadow:inset 0 0 12px rgba(0,0,0,.5)}
.item b{font-size:14px}
.item small{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.buy{height:34px;border-radius:10px;border:1px solid var(--brass);background:transparent;color:var(--brass);font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;font-variant-numeric:tabular-nums}
.buy svg{width:16px;height:16px}
.buy.can{background:var(--brass);color:#1d1407}
.buy:disabled{border-color:var(--panel-line);color:var(--muted)}
.vip{border-radius:16px;padding:14px;background:linear-gradient(135deg,#3a2a0c,#18120a 60%);border:1px solid #c9a24a;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.vip h3{margin:0;font:700 22px var(--f-display);color:#f3d27a}
.vip .price{font-weight:700;margin-top:2px}
.vip ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.vip li::before{content:"♠ ";color:#f3d27a}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pack{border:1px solid var(--panel-line);border-radius:12px;padding:10px 6px;text-align:center;background:rgba(0,0,0,.18);position:relative}
.pack b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.pack span{font-size:12.5px;color:var(--muted)}
.pack em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--brass);color:#1d1407;border-radius:6px;padding:1px 6px}
.fine{font-size:12px;color:var(--muted);margin:12px 0 0;text-align:center}
.adrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--panel-line);background:rgba(0,0,0,.18)}
.adrow div{flex:1;font-size:14px}
.adrow small{display:block;color:var(--muted);font-size:12px}
.adrow button{height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--brass);color:#1d1407;font-weight:800}
.adrow button:disabled{background:rgba(0,0,0,.3);color:var(--muted)}
.adbox{text-align:center;padding:20px 6px}
.adbox .adt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.adbox .adc{font:700 64px/1.1 var(--f-display);color:var(--brass);margin:10px 0}

@media (orientation:landscape) and (max-height:520px){
  .lb-wrap{max-width:1060px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .lb-wrap > .lb-col.b{grid-column:2;grid-row:1}
  .lb-wrap > .lb-col.a{grid-column:1;grid-row:1}
  .brand{font-size:26px}
  .lb-fan{display:none}
  .brand,.tag{max-width:none}
}

[hidden]{display:none!important}
/* ---------- home screen v2: landscape-first, swipe through modes ---------- */
.lb2{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;
  background:var(--page);background-image:var(--noise), radial-gradient(ellipse 90% 60% at 50% 0%, var(--page-hi), var(--page) 75%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none}
.lb2 .lb-bar{display:flex;align-items:center;gap:10px;padding-block:10px 2px;max-width:1100px;width:100%;margin:0 auto}
.lb2 .lb-me{flex:1;min-width:0}
.lb2 .lb-me .av{width:50px;height:50px}
.rank-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 7px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--panel-line);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--brass-dim);background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none;padding:0}
.gear svg{width:20px;height:20px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round}
.lb-sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-block:6px 0;max-width:1100px;width:100%;margin:0 auto}
.lb-sec h2{margin:0;font:700 19px var(--f-display);white-space:nowrap}
.lb-sec small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.modes{flex:1;min-height:0;display:flex;align-items:center;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
  scroll-padding-left:max(16px, env(safe-area-inset-left, 0px));scrollbar-width:none;overscroll-behavior-x:contain}
.modes::-webkit-scrollbar{display:none}
.mc{position:relative;flex:0 0 auto;height:100%;max-height:440px;aspect-ratio:3 / 4;max-width:78vw;box-sizing:border-box;

<script id="logic">
/* ===== Pure game logic (no DOM) ===== */
const SUITS=['S','H','C','D'];
const SYM={S:'♠',H:'♥',C:'♣',D:'♦'};
const RL={11:'J',12:'Q',13:'K',14:'A'};
const NAMES=['You','Dre','Nae','Big Ray'];
let opts={target:500,jokers:false,deuce:false,bags:true,nil:true,timer:true,mode:'classic',blind:true,teamBid:true};
let G=null;

/* modes: classic & jjdd are partnerships; ffa is every player for themself */
const partnersOn=()=>opts.mode!=='ffa';
const jjdd=()=>opts.mode==='jjdd';
const teamCount=()=>partnersOn()?2:4;
const teamOf=p=>partnersOn()?p%2:p;
const members=t=>partnersOn()?[t,t+2]:[t];
const partnerOf=p=>partnersOn()?(p+2)%4:-1;
const jokersOn=()=>jjdd()||opts.jokers;

const dsuit=c=>c.ds||c.s;               // the suit printed on the card
function isRed(c){return c.joker? c.joker==='big' : (dsuit(c)==='H'||dsuit(c)==='D');}
function rankLabel(c){return c.joker? '★' : (RL[c.r]||String(c.r));}
function power(c){
  if(c.s!=='S') return c.r;
  if(c.joker) return c.joker==='big'?116:115;
  if(c.ds==='D') return 114.7;          // JJDD: 2♦ plays as a spade, under the jokers
  if((jjdd()||opts.deuce) && c.r===2) return 114.5;
  return 100+c.r;
}
function makeDeck(){
  const d=[];
  for(const s of SUITS) for(let r=2;r<=14;r++){
    if(jjdd()){
      if(r===2&&(s==='H'||s==='C')) continue;
      if(r===2&&s==='D'){d.push({s:'S',ds:'D',r:2,id:'D2'});continue;}
    } else if(opts.jokers && r===2 && (s==='H'||s==='D')) continue;
    d.push({s,r,id:s+r});
  }
  if(jokersOn()){d.push({s:'S',r:16,id:'BJ',joker:'big'});d.push({s:'S',r:15,id:'LJ',joker:'little'});}
  return d;
}
function hierarchy(){
  const top=[];
  if(jokersOn()) top.push('Big Joker','Little Joker');
  if(jjdd()) top.push('2♦','2♠');
  else if(opts.deuce) top.push('2♠');
  top.push('A♠','K♠','Q♠');
  return top.join(' › ')+' …';
}
/* fair shuffle: the phone's secure random generator (the kind used for encryption), no bias, no "house" logic */
function rndInt(n){try{const u=new Uint32Array(1), lim=Math.floor(4294967296/n)*n; let x; do{crypto.getRandomValues(u); x=u[0];}while(x>=lim); return x%n;}catch(e){return Math.floor(Math.random()*n);}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rndInt(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function dealCode(order){let h=2166136261; for(const ch of order.join(',')){h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0;} const x=h.toString(16).toUpperCase().padStart(8,'0'); return x.slice(0,4)+'-'+x.slice(4);}
const SORT_ORDER={D:0,C:1,H:2,S:3};
function sortHand(h){return h.sort((a,b)=>SORT_ORDER[a.s]-SORT_ORDER[b.s]||power(a)-power(b));}

function newGameState(){
  const n=teamCount();
  return {scores:Array(n).fill(0),bags:Array(n).fill(0),dealer:3,handNo:0,deck:[],hands:[[],[],[],[]],bids:[null,null,null,null],
    tricks:[0,0,0,0],trick:[],leader:0,turn:0,phase:'idle',broken:false,played:new Set(),lastTrick:null,over:false};
}
function dealHand(){
  G.deck=makeDeck(); const d=shuffle(G.deck.slice());
  G.hands=[[],[],[],[]];
  d.forEach((c,i)=>G.hands[(G.dealer+1+i)%4].push(c));
  G.hands.forEach(sortHand);
  G.dealNo=dealCode(d.map(c=>c.id)); G.start=G.hands.map(h=>h.slice());
  G.bids=[null,null,null,null]; G.tricks=[0,0,0,0]; G.trick=[]; G.broken=false; G.played=new Set(); G.lastTrick=null;
  G.blind=[false,false,false,false]; G.hideHand=false; G.teamBid=null;
  G.handNo++;
}
function legal(p){
  const h=G.hands[p];
  if(!G.trick.length){
    if(!G.broken && h.some(c=>c.s!=='S')) return h.filter(c=>c.s!=='S');
    return h.slice();
  }
  const led=G.trick[0].c.s, f=h.filter(c=>c.s===led);
  return f.length? f : h.slice();
}
function eff(c,led){return c.s==='S'? power(c) : (c.s===led? c.r : 0);}
function curWin(){
  const led=G.trick[0].c.s; let bi=0,be=-1;
  G.trick.forEach((t,i)=>{const e=eff(t.c,led); if(e>be){be=e;bi=i;}});
  return {i:bi,p:G.trick[bi].p,e:be,led};
}
function unseen(p){const mine=new Set(G.hands[p].map(c=>c.id));return G.deck.filter(c=>!G.played.has(c.id)&&!mine.has(c.id));}
function isBoss(c,p){const u=unseen(p);return !u.some(x=>x.s===c.s&&power(x)>power(c));}
function teamNeed(t){
  let contract=0,books=0;
  members(t).forEach(p=>{books+=G.tricks[p]; if(G.bids[p]) contract+=G.bids[p];});
  return contract-books;
}
function evalHand(h){
  const sp=h.filter(c=>c.s==='S'), n=sp.length; let t=0;
  const allSp=makeDeck().filter(c=>c.s==='S');
  sp.forEach(c=>{
    const above=allSp.filter(x=>power(x)>power(c)&&!sp.some(y=>y.id===x.id)).length; // higher spades held by others
    if(above===0) t+=1;
    else if(above===1) t+= n>=2?0.8:0.25;
    else if(above===2) t+= n>=3?0.5:0.1;
    else if(above===3) t+= n>=4?0.25:0;
  });
  if(n>4) t+=(n-4)*0.75;
  for(const s of ['H','C','D']){
    const cs=h.filter(c=>c.s===s), L=cs.length, has=r=>cs.some(c=>c.r===r);
    if(has(14)) t+= L<=5?0.95:0.6;
    if(has(13)) t+= (L>=2&&L<=5)?(has(14)?0.8:0.55):(L===1?0.15:0.3);
    if(has(12)&&L>=3&&L<=4&&(has(14)||has(13))) t+=0.25;
    if(L===0&&n>=2) t+=Math.min(n-1,2)*0.6;
    else if(L===1&&n>=3) t+=0.45;
    else if(L===2&&n>=4) t+=0.2;
  }
  return t;
}
function suggestBid(p){
  const h=G.hands[p], t=evalHand(h);
  const hiSp=h.some(c=>c.s==='S'&&power(c)>=112), nSp=h.filter(c=>c.s==='S').length;
  const aces=h.filter(c=>c.r===14).length;
  const partner=partnerOf(p), pNil=partner>=0&&G.bids[partner]===0;
  if(opts.nil && !pNil && t<1.3 && !hiSp && nSp<=3 && aces===0) return 0;
  let b=Math.max(1,Math.round(t*1.1));
  if(pNil) b=Math.min(13,b+1);
  return Math.min(13,b);
}
function botChoose(p){
  const L=legal(p), partner=partnerOf(p), t=teamOf(p);
  const nilMe=G.bids[p]===0&&G.tricks[p]===0;
  const pNil=partner>=0&&G.bids[partner]===0&&G.tricks[partner]===0;
  const opps=[0,1,2,3].filter(o=>o!==p&&o!==partner);
  const oNil=opps.filter(o=>G.bids[o]===0&&G.tricks[o]===0);
  let need=teamNeed(t);
  const oppNeed=partnersOn()?teamNeed(1-t):Math.max(...opps.map(o=>teamNeed(o))), left=G.hands[p].length;
  if(need<=0 && oppNeed>0 && left<=oppNeed+1) need=1; // go for the set
  const byPow=(a,b)=>power(a)-power(b);
  const low=arr=>arr.slice().sort(byPow)[0];
  const high=arr=>arr.slice().sort(byPow).pop();
  const nonSp=arr=>arr.filter(c=>c.s!=='S');
  if(!G.trick.length){
    if(nilMe) return low(L);
    const bosses=L.filter(c=>isBoss(c,p));
    if(pNil) return bosses.length? high(bosses) : high(nonSp(L).length?nonSp(L):L);
    if(oNil.length) return low(L);
    if(need>0){

      const sb=bosses.filter(c=>c.s==='S'), mySp=G.hands[p].filter(c=>c.s==='S').length;
      if(sb.length&&mySp>=3) return high(sb);
      const side=nonSp(L);
      if(side.length){const cnt=s=>G.hands[p].filter(c=>c.s===s).length; side.sort((a,b)=>cnt(a.s)-cnt(b.s)||a.r-b.r); return side[0];}
      return low(L);
    }
    return low(L);
  }
  const cw=curWin(), led=cw.led;
  const winners=L.filter(c=>eff(c,led)>cw.e), losers=L.filter(c=>eff(c,led)<=cw.e);
  const byEff=(a,b)=>eff(a,led)-eff(b,led);
  const lowW=()=>winners.slice().sort(byEff)[0];
  const highL=()=>losers.slice().sort(byPow).pop();
  const last=G.trick.length===3;
  const partnerPlayed=partner>=0&&G.trick.some(x=>x.p===partner), partnerWinning=partner>=0&&cw.p===partner;
  if(nilMe) return losers.length? highL() : high(winners);
  if(pNil){
    if(partnerPlayed){ if(partnerWinning) return winners.length? lowW() : low(L); return losers.length? low(losers) : lowW(); }
    return winners.length? winners.slice().sort(byEff).pop() : low(L);
  }
  if(oNil.includes(cw.p)) return losers.length? highL() : lowW();
  if(partnerWinning){
    const safe=last||isBoss(G.trick[cw.i].c,p);
    if(safe||need<=0) return losers.length? low(losers) : lowW();
    const bw=winners.filter(c=>isBoss(c,p)); if(bw.length) return bw.sort(byEff)[0];
    return losers.length? low(losers) : lowW();
  }
  if(need<=0) return losers.length? highL() : lowW();
  if(winners.length){
    if(last) return lowW();
    const bw=winners.filter(c=>isBoss(c,p)); if(bw.length) return bw.sort(byEff)[0];
    if(winners.some(c=>c.s==='S'&&led!=='S')) return lowW();
    if(G.trick.length===1&&losers.length) return low(losers);
    return lowW();
  }
  return low(losers.length?losers:L);
}
function scoreTeam(t){
  const ps=members(t); let pts=0,contract=0,books=0; const notes=[];
  const tb=G.teamBid&&G.teamBid[t]!=null?G.teamBid[t]:null;
  ps.forEach(p=>{books+=G.tricks[p];
    if(G.bids[p]===0){ const bl=G.blind&&G.blind[p], v=bl?200:100, kind=bl?'blind nil':'nil';
      if(G.tricks[p]===0){pts+=v;notes.push(`${NAMES[p]} made ${kind}  +${v}`);} else {pts-=v;notes.push(`${NAMES[p]}'s ${kind} got busted  −${v}`);} }
    else contract+=G.bids[p];
  });
  if(tb!=null) contract=tb;
  let bagsAdd=0, set=false;
  if(contract>0){
    if(books>=contract){pts+=contract*10; bagsAdd=books-contract; pts+=bagsAdd;}
    else {pts-=contract*10; set=true;}
  } else {bagsAdd=books; pts+=books;}
  let bags=G.bags[t]+bagsAdd, penalty=false;
  if(opts.bags&&bags>=10){pts-=100;bags-=10;penalty=true;}
  if(books===13) notes.push('Boston — all 13 books');
  return {contract,books,pts,bagsAdd,bags,set,penalty,notes};
}
/* blind nil: allowed when your side trails the leader by 100+ */
function blindEligible(p){
  return !!(opts.blind&&opts.nil&&G.blindOK);
}
function behindBy(p){const t=teamOf(p);return Math.max(...G.scores.filter((_,i)=>i!==t))-G.scores[t];}
/* game over: someone hits the target or falls to the floor, with a clear leader */
function gameOverCheck(target,floor){
  const s=G.scores, mx=Math.max(...s), lead=s.filter(x=>x===mx).length===1;
  if((s.some(x=>x>=target)||s.some(x=>x<=floor))&&lead) return {over:true,winner:s.indexOf(mx)};
  return {over:false,winner:-1};
}

/* ---------- card sounds: soft, felt-table realistic ----------

let NZ=null, MIX=null;
function bus(){ // one gentle master chain: soft compressor + a touch of room

function noiseBuf(){ if(NZ) return NZ; const n=AC.sampleRate*1.5; NZ=AC.createBuffer(1,n,AC.sampleRate); const d=NZ.getChannelData(0);
  let b0=0,b1=0,b2=0; for(let i=0;i<n;i++){const w=Math.random()*2-1; b0=0.99765*b0+w*0.099; b1=0.963*b1+w*0.2965; b2=0.57*b2+w*1.0527; d[i]=(b0+b1+b2+w*0.1848)*0.18;} // pinkish: warmer than white noise

function burst(t,dur,{type='bandpass',f0=1200,f1=null,q=0.8,vol=0.1,attack=0.004}={}){

const rnd=(a,b)=>a+Math.random()*(b-a);
/* a card set down on the felt: a muffled tap with a little body */
function cardTap(vol=1,delay=0){

  const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(rnd(150,190),t); o.frequency.exponentialRampToValueAtTime(90,t+0.06);

/* a card slid across the table: a soft paper swish */
function cardSwish(vol=1,delay=0,dur=0.11){

  burst(t,dur,{type:'bandpass',f0:rnd(2400,3000),f1:rnd(900,1200),q:0.9,vol:0.06*vol,attack:0.02});

/* throwing a card into the middle: swish, then it lands */
function cardThrow(landMs){ cardSwish(0.9,0,Math.max(0.08,landMs/1000*0.8)); cardTap(1,landMs/1000); }
/* dealing: a quick "fwip" per card */
function dealFwip(delay){ if(!soundOn||!AC) return; const t=AC.currentTime+delay;
  burst(t,0.07,{type:'bandpass',f0:rnd(2600,3400),f1:rnd(1300,1700),q:1.1,vol:0.05,attack:0.006}); cardTap(0.35,delay+0.05); }

function riffle(delay=0){
  if(!soundOn||!AC) return; const t0=AC.currentTime+delay, n=46, len=0.6;
  for(let i=0;i<n;i++){const x=i/n, t=t0+len*(x+0.35*x*(1-x))+rnd(-0.004,0.004);

/* ---------- original table music: a smooth lounge loop, composed and played live in code ----------

const MUS={on:true,vol:0.5,playing:false,timer:null,next:0,step:0,gain:null};
try{const m=JSON.parse(localStorage.getItem('bb-music')||'null'); if(m){MUS.on=!!m.on; MUS.vol=Math.max(0,Math.min(1,+m.vol));}}catch(e){}

const BPM=84, SPB=60/BPM, SWING=0.62, hz=n=>440*Math.pow(2,(n-69)/12);
const PROG=[ // [bass root, rootless voicing]
  [39,[55,58,62,65]], // Ebmaj9
  [36,[51,55,58,62]], // Cm9
  [41,[56,60,63,67]], // Fm9
  [34,[56,60,62,67]], // Bb13
  [44,[55,58,60,63]], // Abmaj9
  [43,[53,57,58,62]], // Gm9
  [41,[56,60,63,67]], // Fm9

function musicBus(ctx){
  if(MUS.gain&&MUS.gain.context===ctx) return MUS.gain;
  const g=ctx.createGain(); g.gain.value=MUS.vol*0.8;
  const warm=ctx.createBiquadFilter(); warm.type='lowpass'; warm.frequency.value=5200;
  const len=ctx.sampleRate*1.6, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*0.4;}
  const rv=ctx.createConvolver(); rv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=0.22;
  g.connect(warm); warm.connect(ctx.destination); warm.connect(rv); rv.connect(wet); wet.connect(ctx.destination);
  MUS.gain=g; return g;
}
function mNoise(ctx){ if(mNoise.b&&mNoise.b.sampleRate===ctx.sampleRate) return mNoise.b; const n=ctx.sampleRate; const b=ctx.createBuffer(1,n,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1; mNoise.b=b; return b; }
function ePiano(ctx,out,t,m,dur,vel){
  const f=hz(m), car=ctx.createOscillator(), mod=ctx.createOscillator(), mg=ctx.createGain(), amp=ctx.createGain(), trem=ctx.createOscillator(), tg=ctx.createGain(), lp=ctx.createBiquadFilter();

  mg.gain.setValueAtTime(f*1.3,t); mg.gain.exponentialRampToValueAtTime(f*0.12,t+0.5);
  mod.connect(mg); mg.connect(car.frequency);
  amp.gain.setValueAtTime(0.0001,t); amp.gain.exponentialRampToValueAtTime(0.07*vel,t+0.012); amp.gain.exponentialRampToValueAtTime(0.035*vel,t+0.7); amp.gain.setTargetAtTime(0.0001,t+dur,0.18);
  trem.frequency.value=4.6; tg.gain.value=0.012*vel; trem.connect(tg); tg.connect(amp.gain);
  lp.type='lowpass'; lp.frequency.value=2600;
  car.connect(amp); amp.connect(lp); lp.connect(out);
  [car,mod,trem].forEach(o=>{o.start(t);o.stop(t+dur+1.2);});
}
function bassNote(ctx,out,t,m,dur){
  const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
  o.type='sine'; o.frequency.value=hz(m); o2.type='triangle'; o2.frequency.value=hz(m); const g2=ctx.createGain(); g2.gain.value=0.35;
  lp.type='lowpass'; lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(380,t+0.25);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.015); g.gain.exponentialRampToValueAtTime(0.07,t+0.35); g.gain.setTargetAtTime(0.0001,t+dur,0.08);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(out); [o,o2].forEach(x=>{x.start(t);x.stop(t+dur+0.6);});

function kick(ctx,out,t,v=1){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(105,t); o.frequency.exponentialRampToValueAtTime(42,t+0.14);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22*v,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.32); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.35); }

  s.connect(f); f.connect(g); g.connect(out); s.start(t,Math.random()*0.5,0.08); }

  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.045,t+0.005); g.gain.setTargetAtTime(0.0001,t+0.05,dur*0.5);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out); [o,o2].forEach(x=>{x.start(t);x.stop(t+dur*2.5);}); }
/* one swung 8th-note step; 8 steps a bar, 8 bars a loop */
function musicStep(ctx,out,step,t){
  const bar=Math.floor(step/8)%8, pos=step%8, beat=pos>>1, off=pos&1, [root,voice]=PROG[bar], next=PROG[(bar+1)%8][0], loop=Math.floor(step/64);
  const drop=(Math.floor(step/8)%16)===15; // a breath every 16 bars
  if(pos===0){ voice.forEach((m,i)=>ePiano(ctx,out,t+i*0.012,m,SPB*1.7,0.9)); bassNote(ctx,out,t,root,SPB*0.9); if(!drop) kick(ctx,out,t); }
  if(pos===3&&Math.random()<0.55) voice.slice(1).forEach((m,i)=>ePiano(ctx,out,t+i*0.01,m,SPB*0.8,0.55));
  if(pos===3&&!drop&&Math.random()<0.4) kick(ctx,out,t,0.6);
  if(pos===4) bassNote(ctx,out,t,root+(Math.random()<0.7?7:12),SPB*0.8);
  if(pos===7&&Math.random()<0.6) bassNote(ctx,out,t,next+(Math.random()<0.5?-1:2),SPB*0.35);

function newGame(extra){

  clearTimers(); stopClock(); clearTrick(true);
  G=newGameState(); Object.assign(G,{stake:0,tour:0,blindOK:false},extra||{}); sel=null; busy=false;
  setOpps(G.tour?G.tour-1:0);

  else startHand();
}
function startHand(){
  if(ONL.on&&!ONL.dealt) return onlineDeal();
  if(!ONL.on) dealHand(); ONL.dealt=false; sel=null; busy=false; clearTrick(true); G.recap=[]; clearTrackers();
  G.phase='bid'; G.turn=(G.dealer+1)%4;
  G.hideHand=ONL.spec||blindEligible(0);
  renderSeats(); const sh=reduce||FF?0:1500; if(sh) shuffleFx(G.dealer); renderHand(true,reduce?0:sh+300); riffle(0); if(sh) setTimeout(()=>riffle(0),700); if(!reduce&&!FF) G.hands[0].forEach((_,i)=>dealFwip(sh/1000+0.3+i*0.07)); status(`${G.dealer===0?'You’re':NAMES[G.dealer]+' is'} shuffling…`);
  later(()=>status('Bidding'),sh);

}
const teamBidding=()=>opts.teamBid&&partnersOn();
function teamSuggest(t){const ms=members(t).filter(p=>G.bids[p]===null); return Math.max(1,ms.reduce((a,p)=>a+Math.max(1,suggestBid(p)),0));}
function setTeamBid(t,v){
  G.teamBid=G.teamBid||[null,null]; G.teamBid[t]=v;
  const ms=members(t).filter(p=>G.bids[p]===null);
  if(ms.length===1) G.bids[ms[0]]=v; else {const hi=Math.ceil(v/2); G.bids[ms[0]]=hi; G.bids[ms[1]]=(v-hi)||0.5;}
}
const teamOrder=()=>[1,3,2,0].map(k=>(G.dealer+k)%4);
const teamSum=t=>members(t).reduce((a,q)=>a+(G.bids[q]||0),0);
function teamCall(p){ /* once both partners have called, say the combined number */
  const m=partnerOf(p); if(G.bids[m]===null) return;
  const sum=teamSum(teamOf(p)); later(()=>say(p, sum?`That’s ${sum} for us.`:'Double nil, let’s go.',1800), 700);
}
function nextTeamBid(){
  const p=teamOrder().find(q=>G.bids[q]===null);
  if(p===undefined) return later(startPlay, 900);
  G.turn=p; renderSeats();
  if(ONL.on) return onlineBidTurn(p);
  if(p===0){showBid(); userClock(); return;}
  status(NAMES[p]+' is calling books…'); startClock(p);
  later(()=>{
    stopClock(); const b=suggestBid(p); G.bids[p]=b; say(p, b===0?'Nil.':`I got ${b}.`, 1600); snap(0.25,1500);
    if(b===0&&isPartner(p)) later(()=>say(oppSeat(),pick(LINES.nilBid)),900);
    teamCall(p); renderSeats(); later(nextTeamBid, reduce?50:(G.bids[partnerOf(p)]!==null?1500:700));
  }, reduce?80:800+Math.random()*400);
}
function nextBid(){
  if(teamBidding()) return nextTeamBid();
  if(G.bids.every(b=>b!==null)) return startPlay();
  if(G.bids[G.turn]!==null){G.turn=(G.turn+1)%4; return nextBid();}
  renderSeats();
  const p=G.turn;
  if(ONL.on) return onlineBidTurn(p);
  if(p===0){showBid();userClock();return;}
  status(NAMES[p]+' is bidding…'); startClock(p);
  later(()=>{
    stopClock();
    const b=suggestBid(p); G.bids[p]=b; say(p, b===0?'Nil.':`I got ${b}.`, 1800); snap(0.25,1500);
    if(b===0 && isPartner(p)) later(()=>say(oppSeat(),pick(LINES.nilBid)),900);
    G.turn=(p+1)%4; renderSeats(); later(nextBid,reduce?50:650);
  }, reduce?80:700+Math.random()*400);
}
function showBid(){

function gameVote(done){

    chime(ok);
    later(()=>{vp.hidden=true; toast(ok?'Blind nil is on this game. Anyone can call it before looking.':'No blind nil this game.',2600); done();},reduce?200:1700);
  };
  const cast=y=>{stopClock();status('');votes[0]=y;draw();$('#vpAct').innerHTML='';say(0,pick(y?VOTE_LINES.yes:VOTE_LINES.no),1800);reveal(1);};
  $('#vpYes').onclick=()=>{audio();cast(true);}; $('#vpNo').onclick=()=>{audio();cast(false);};

function preBid(done){
  const bots=()=>{ // at most one bot goes blind a hand; more likely when its side is behind
    if(G.blindOK&&(!ONL.on||ONL.host)){
      const c=[1,2,3].filter(q=>G.bids[q]===null&&!(partnerOf(q)>=0&&G.blind[partnerOf(q)])&&(!ONL.on||oBot(toA(q))));
      const q=c.find(x=>Math.random()<(behindBy(x)>=150?0.3:behindBy(x)>=60?0.12:0.04));
      if(q&&ONL.on){post(evId('b'+toA(q)),{s:toA(q),v:0,blind:true});later(done,reduce?100:1200);return;}
      if(q){G.bids[q]=0;G.blind[q]=true;renderSeats();say(q,pick(VOTE_LINES.go),2200);snap(0.3,1400);
        if(!isPartner(q)) later(()=>say(partnersOn()?2:oppSeat(),pick(['Bet. We coming for that 😈','Bold. We’ll see 😂'])),900);
        later(done,reduce?100:1200);return;}
    }
    done();
  };
  if(G.hideHand&&!FF&&!ONL.spec) blindOffer(bots); else { if(!ONL.spec&&G.hideHand){G.hideHand=false;renderHand();} bots(); }
}
function blindOffer(cb){

function submitBid(v){
  if(!G||G.phase!=='bid'||G.turn!==0) return;

  if(ONL.on) return onlineBid(v);
  if(teamBidding()){ stopClock(); $('#bidPanel').hidden=true; G.bids[0]=v; say(0,v===0?'Nil.':`I got ${v}.`,1600); snap(0.3,1500);
    if(v===0) later(()=>say(oppSeat(),pick(LINES.nilBid)),800);
    teamCall(0); renderSeats(); later(nextTeamBid, G.bids[2]!==null?1500:600); return; }
  stopClock(); $('#bidPanel').hidden=true;
  G.bids[0]=v; say(0,v===0?'Nil.':`I got ${v}.`,1600); snap(0.3,1500);
  if(v===0) later(()=>say(oppSeat(),pick(LINES.nilBid)),800);

function startPlay(){

function nextTurn(){

  status(''); renderHand();

function tapCard(c){

    if(G.trick.length) toast(`You have to follow ${({S:'spades',H:'hearts',C:'clubs',D:'diamonds'})[G.trick[0].c.s]}.`);

  }

function playCard(p,c){
  busy=true; stopClock();

  else from=seatPt(p);
  const h=G.hands[p], hi=h.findIndex(x=>x.id===c.id); h.splice(hi>=0?hi:h.length-1,1);
  const ledBefore=G.trick.length?G.trick[0].c.s:null;
  const breaking=c.s==='S'&&!G.broken;
  G.trick.push({p,c}); G.played.add(c.id); if(c.s==='S') G.broken=true;
  if(breaking){ later(()=>spadesBroken(p),FLY); if(G.recap) G.recap.push(`${nmOf(p)} broke spades on book ${G.tricks.reduce((a,b)=>a+b,0)+1}`); }

  const rot=(Math.random()*14-7);

function resolveTrick(){
  const cwin=curWin(), w=cwin.p; G.tricks[w]++; G.lastTrick=G.trick.map(t=>({p:t.p,c:t.c}));
  if(G.recap&&cwin.led!=='S'&&G.trick[cwin.i].c.s==='S'&&G.trick[0].p!==w){const L=G.trick[0].c; G.recap.push(`${nmOf(w)} cut ${nmOf(G.trick[0].p)==='You'?'your':nmOf(G.trick[0].p)+'’s'} ${rankLabel(L)}${SYM[L.s]||''} lead`);}
  if(w===0&&cwin.led!=='S'&&G.trick[cwin.i].c.s==='S') track('cut');
  if(G.blind[w]&&G.tricks[w]===1){
    toast(w===0?'Your blind nil got busted':`${NAMES[w]}'s blind nil got busted`,2600); chime(w===0||isPartner(w)?false:true);
    const mock=[0,1,2,3].filter(q=>q!==w&&q!==partnerOf(w)&&q!==0); if(mock.length) later(()=>say(pick(mock),pick(['BUSTED! 😂','Blind nil? More like blind FAIL 😂','Told y’all. Pay up.'])),300);
  }
  const to=seatPt(w);

  const old=trickEls; trickEls=[]; later(()=>old.forEach(d=>d.remove()),reduce?80:460);
  gather();
  // banter
  const r=Math.random();
  if(isPartner(w)&&r<0.22) say(2,pick(LINES.partWin));
  else if(w!==0&&!isPartner(w)&&r<0.22) say(w,pick(LINES.oppWin));
  else if(w===0&&r<0.14) say(oppSeat(),pick(LINES.oppLose));
  G.trick=[]; G.leader=w; G.turn=w; renderSeats();
  if(G.hands.every(h=>h.length===0)) later(endHand,reduce?100:700);

}
const nmOf=p=>p===0?'You':String(NAMES[p]).replace(' 🤖','');
function shuffleFx(dealer){

  cards.forEach((c,i)=>c.animate([
    {transform:'translate(0,0) rotate(0)'},
    {transform:`translate(${half(i)*w*0.62}px,${-2}px) rotate(${half(i)*-8}deg)`,offset:0.22},
    {transform:`translate(0,${-i*0.3}px) rotate(0)`,offset:0.42},
    {transform:`translate(${half(i)*w*0.62}px,${-2}px) rotate(${half(i)*-8}deg)`,offset:0.62},
    {transform:'translate(0,0) rotate(0)',offset:0.82},
    {transform:'translate(0,0) rotate(0)'}],{duration:1100,easing:'ease-in-out',delay:i*12}));

  setTimeout(()=>{
    for(let k=0;k<8;k++){const p=(dealer+1+k)%4, T=seatPt(p), c=cards[n-1-k]; if(!c) break;

    setTimeout(()=>box.remove(),900);
  },1150);
}

function ensureDaily(){

  const pool=MISSIONS.map(m=>m.id), ids=[];
  while(ids.length<3){h=(h*1103515245+12345)>>>0; const i=h%pool.length; ids.push(pool.splice(i,1)[0]);}

}
function track(k,n=1){

    const b=D.prog[id]||0, a=Math.min(m.g,b+n); D.prog[id]=a;

/* ----- table screen: rules, stakes, Join ----- */
function openTable(m){
  const tour=m==='tourney';
  let mode=tour?'classic':m, picked=false;
  if(m==='random'){mode=pick(['classic','jjdd','ffa']);picked=true;}
  const M=MODES[mode];
  let target=(mode==='ffa'||tour)?100:([100,300,500].includes(opts.target)&&opts.mode===mode?opts.target:300);
  let stake=tour?TOUR_FEE:0, high=false;
  const v=sheet('<div id="tbl"></div>',{mid:true});
  const draw=()=>{
    const hier=withMode(mode,()=>hierarchy());
    const rules=withMode(mode,()=>[mode==='jjdd'?null:(opts.jokers?'Jokers in':null),opts.nil?'Nil allowed':'No nil',opts.bags?'10 bags = −100':'No bag penalty',opts.timer?'15-second turns':'No turn clock',opts.blind&&opts.nil?'Blind nil by vote':null].filter(Boolean).join(' · '));
    const P=mode!=='ffa', can=PROFILE.coins>=stake;
    const stBtn=x=>`<button data-st="${x}" class="${x===stake?'on':''}" ${PROFILE.coins<x?'disabled':''}>${x?coinIcon()+kfmt(x):'Free'}<small>${x?(P?'Win '+kfmt(x*2):'1st wins '+kfmt(x*3)):'No entry'}</small></button>`;
    const win=tour?'1,500 + trophy':(stake?(P?fmt(stake*2):`${fmt(stake*3)} for 1st`):'XP & coins');
    v.querySelector('#tbl').innerHTML=`
      ${picked?`<div class="lvup" style="animation:none;margin:0 0 10px">🎲 Random picked <b>${M.name}</b></div>`:''}
      <h2>${tour?'🏆 Weekend Cup':M.name}</h2>
      <p class="lede">${tour?'Three rounds of Classic Spades to 100. Win and move on. Lose once and you’re out.':M.desc}</p>
      <div class="tinfo">
        <div><small>Players</small><b>${P?'4 · two teams':'4 · no partners'}</b></div>
        <div><small>Game</small><b>To ${target}${tour?' · 3 rounds':''}</b></div>
        <div class="w"><small>Card order (highest first)</small><b>${hier}</b></div>
        <div class="w"><small>Table rules</small><b>${rules}</b></div>
      </div>
      ${(!tour&&mode!=='ffa')?`<h4>Play to</h4><div class="seg tseg">${[100,300,500].map(t=>`<label><input type="radio" name="ttg" value="${t}" ${t===target?'checked':''}><span>${t}</span></label>`).join('')}</div>`:''}
      ${tour?`<h4>Prizes</h4><div class="tinfo"><div><small>Champion</small><b>1,500 coins + 🏆</b></div><div><small>Finalist</small><b>300 coins</b></div></div>`
        :`<h4>Table stakes</h4><div class="stakes">${[0,100,500,2500].map(stBtn).join('')}</div>
          ${high||HIGH_STAKES.includes(stake)?`<h4 class="hr">💎 High roller tables</h4><div class="stakes hi">${HIGH_STAKES.map(stBtn).join('')}</div>`
            :`<button class="btn ghost hrbtn" id="tHigh">＋ Higher stakes · up to ${kfmt(HIGH_STAKES[HIGH_STAKES.length-1])}</button>`}`}
      <div class="tsum"><span>Entry <b>${stake?fmt(stake):'Free'}</b></span><span>Win <b>${win}</b></span><span>You have <b>${fmt(PROFILE.coins)}</b></span></div>
      <button class="btn" id="tJoin" ${can?'':'disabled'}>${can?(stake?`Join table · pay ${fmt(stake)}`:'Join table'):'Not enough coins'}</button>
      ${(mode!=='jjdd'&&!tour)?'<button class="btn ghost" id="tRules">House rules</button>':''}
      <p class="fine">Coins are for play only. They can’t be cashed out, traded or sent to other players.</p>`;
    v.querySelectorAll('input[name="ttg"]').forEach(i=>i.onchange=()=>{target=+i.value;draw();});
    v.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{stake=+b.dataset.st;draw();});
    const th=v.querySelector('#tHigh'); if(th) th.onclick=()=>{high=true;draw();};
    const r=v.querySelector('#tRules'); if(r) r.onclick=()=>{v.remove();rulesSheet(()=>openTable(m));};
    v.querySelector('#tJoin').onclick=()=>{
      if(PROFILE.coins<stake) return;
      PROFILE.coins-=stake; saveProfile(); audio(); v.remove();
      startTable({mode,target,stake:tour?0:stake,tour:tour?1:0});
    };
  };
  draw();
}

function startTable(t){
  if(ONL.on){ const q=quitCounts(); if(q) noteQuit(); onlineLeave(true,q); }
  const go=()=>{
    opts.mode=t.mode; opts.target=t.target; try{localStorage.setItem('bb-opts',JSON.stringify(opts));}catch(e){}
    const lb=document.getElementById('lobby'); if(lb) lb.hidden=true; $('#bidPanel').hidden=true;
    newGame({stake:t.stake,tour:t.tour});
    if(t.tour) setTimeout(()=>toast(`${TOUR_ROUNDS[0]}: you and Nae vs ${NAMES[1]} and ${NAMES[3]}`,3000),300);
    renderMe();
  };
  if(!PROFILE.tut) tutorialSheet(t.mode,go); else go();
}
/* first-time tutorial: four quick screens, skippable */
function tutorialSheet(mode,done){
  const ffa=mode==='ffa';
  const steps=[
    ['♠','Spades are always trump',ffa?'Four players, no partners. Every book you take is yours alone.':'You and Nae are partners, sitting across from each other. Your books count together.'],
    ['🎯','Bid your books','Before play, guess how many tricks (books) you’ll take. The coach suggests a number, glowing gold. Bid Nil if you think you’ll take none.'],
    ['🃏','Follow suit','Play the suit that was led if you can. If you can’t, cut with a spade to win it or throw off a low card. You can’t lead spades until one has been played.'],
    ['💼','Make your bid, dodge bags','Make it and score 10 per book bid. Miss and lose 10 per book. Extra books are bags, and 10 bags costs 100. Tap a card to lift it, tap again to play.']
  ];
  let i=0;
  const v=sheet('<div id="tut"></div>',{mid:true,noClose:true});
  const draw=()=>{const [icon,t,d]=steps[i];
    v.querySelector('#tut').innerHTML=`<div class="tut"><div class="ti">${icon}</div><h2>${t}</h2><p class="lede">${d}</p>
      <div class="tdots">${steps.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
      <button class="btn" id="tNext">${i<steps.length-1?'Next':'Deal the cards'}</button>
      <button class="btn ghost" id="tSkip">Skip</button></div>`;
    v.querySelector('#tNext').onclick=()=>{if(i<steps.length-1){i++;draw();}else finish();};
    v.querySelector('#tSkip').onclick=finish;};
  const finish=()=>{PROFILE.tut=true;saveProfile();v.remove();done();};
  draw();
}

<script id="online">
/* ===== Online private tables (Firebase) =====
   Every move is an event with a fixed id (like "0.3.p17" = game 0, hand 3, 18th card).
   An event is written once (first writer wins) and every phone applies the same events in
   the same order, so all four tables stay in sync. The host's phone deals, writes each
   player's private hand, and plays the bots and anyone who runs out of time. */
const FB_CFG={apiKey:"AIzaSyA7O2ZOJsyA12aHqJ2ku359_ZMnF13mpAA",authDomain:"bags-and-books.firebaseapp.com",projectId:"bags-and-books",storageBucket:"bags-and-books.firebasestorage.app",messagingSenderId:"486701198947",appId:"1:486701198947:web:998b7c86629cc4dcd51256"};
