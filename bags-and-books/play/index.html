  const [A,U,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FB_CFG), db=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); /* falls back when a network holds up the live stream */
  const auth=/[?&#]fresh/.test(location.href)?U.initializeAuth(app,{persistence:U.inMemoryPersistence}):U.getAuth(app); // ?fresh = a separate test player in the same browser
  await auth.authStateReady();
  if(!auth.currentUser) await U.signInAnonymously(auth);
  FB={F,db,U,auth,uid:auth.currentUser.uid};
  return FB;
}
const toL=a=>(a-ONL.me+4)%4, toA=l=>(l+ONL.me)%4;
const evId=k=>`${ONL.g}.${G.handNo}.${k}`;
function oBot(a){return !ONL.seats[a]||ONL.gone.has(a);}
function oHuman(p){const a=toA(p);return a!==ONL.me&&!oBot(a);}
const tRef=(...p)=>FB.F.doc(FB.db,'tables',ONL.code,...p);
const cleanAv=a=>{a=a||{};const ok=(v,l,d)=>l.includes(v)?v:d, n=(v,m)=>Number.isInteger(v)&&v>=0&&v<m?v:0;
  return {skin:n(a.skin,SKIN.length),hc:n(a.hc,HAIRC.length),shirt:n(a.shirt,SHIRT.length),hair:ok(a.hair,HAIR.map(x=>x[0]),'fade'),facial:ok(a.facial,FACIAL.map(x=>x[0]),'none'),acc:ok(a.acc,ACC.map(x=>x[0]),'none')};};
const mySeatInfo=()=>({uid:FB.uid,name:String(PROFILE.name||'Player').slice(0,14),av:cleanAv(PROFILE.av),lvl:lvlInfo(PROFILE.xp).L,rk:rankOf(PROFILE.rp),h:PROFILE.handle||''});

/* write an event once; if it already exists, someone beat us to it and theirs stands */
async function post(id,data){
  if(!FB||!ONL.code||ONL.spec) return false;
  const {F,db}=FB, ref=F.doc(db,'tables',ONL.code,'ev',id);
  const t0=Date.now(); ONL.sentAt=ONL.sentAt||{}; ONL.sentAt[id]=t0;
  try{ await F.setDoc(ref,Object.assign({by:FB.uid,at:F.serverTimestamp()},data)); return true; }
  catch(e){ if(e&&e.code==='permission-denied'){ const mine=!!(ONL.ev[id]&&ONL.ev[id].local);
      for(let i=0;i<8&&(!ONL.ev[id]||ONL.ev[id].local);i++) await new Promise(r=>setTimeout(r,250));
      if(ONL.ev[id]&&!ONL.ev[id].local&&ONL.ev[id].by!==FB.uid){ if(!mine&&/\.[bp]\d+$/.test(id)) toast('Time ran out, so the table moved for you.',2400); return true; } } /* the table already moved for this seat; that move stands */
    console.warn('post',id,e); return false; }
}
/* ---- table server (Cloud Function): deals, plays bots, covers timeouts; nobody's phone holds other players' cards ---- */
const SRV_URL='https://us-central1-bags-and-books.cloudfunctions.net/table';
const GRACE=2500; /* the server gives a real player this much extra before it moves for them */
/* my own bid or card shows the moment I tap it; the server's copy confirms it a beat later */
function mineNow(id,d){ const loc=Object.assign({by:FB.uid,local:true},d); ONL.ev[id]=loc; onEv(id,loc); }
function confirmMine(id,x){
  const h=ONL.ev[id], same=x.s===h.s&&x.c===h.c&&x.v===h.v;
  ONL.ev[id]=x; evClock(id,x);
  const t0=ONL.sentAt&&ONL.sentAt[id]; if(t0&&!FF){ LAG.up.push(Date.now()-t0); LAG.me=med(LAG.up.slice(-6)); renderSeats(); }
  if(!same){ toast('Time ran out, so the table moved for you.',2600); resync(); }
}
/* something went wrong between this phone and the table: rebuild the table from the server */
let resyncing=false;
function resync(){
  if(resyncing||!ONL.on||!ONL.code) return; resyncing=true; const c=ONL.code;
  onlineUnsub(); ONL.tok++; clearTimers(); stopClock(); clearTrick(true); ONL.on=false; ONL.code=null; ONL.wait=null; ONL.watch=null; ONL.handWait=null;
  rejoinTable(c).finally(()=>{resyncing=false;});
}
/* after my move, nudge the server so the bots after me go right away */
function srvNext(){
  if(!ONL.srv||!ONL.code||!FB) return; const code=ONL.code;
  FB.auth.currentUser.getIdToken().then(t=>fetch(SRV_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({code,id:'next'})})).catch(()=>{});
}
/* ---- connection quality: signal bars at each seat, and a short report after each hand ---- */
var LAG={up:[],dn:[],seat:{},me:null};
const med=a=>{ if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
function sigLvl(ms){ return ms==null?0:ms<450?3:ms<1200?2:1; }
function sigFor(p){
  if(!ONL.on||!ONL.seats) return '';
  const a=toA(p); if(a!==ONL.me&&(!ONL.seats[a]||ONL.gone.has(a))) return '';
  const ms=a===ONL.me?LAG.me:LAG.seat[a], l=sigLvl(ms); if(!l) return '';
  return `<span class="sig s${l}" title="Connection: ${ms} ms"><i></i><i></i><i></i></span>`;
}
function appKind(){ const u=navigator.userAgent||'';
  return /Instagram/.test(u)?'instagram':/FBAN|FBAV/.test(u)?'facebook':/Snapchat/.test(u)?'snapchat':/TikTok|musical_ly/i.test(u)?'tiktok':
    (navigator.standalone||matchMedia('(display-mode: standalone)').matches)?'homescreen':/CriOS/.test(u)?'chrome-ios':/iPhone|iPad/.test(u)?'safari-ios':/Android/.test(u)?'android':'desktop'; }
function stats(a){ if(!a.length) return {n:0}; const b=a.slice().sort((x,y)=>x-y), q=f=>b[Math.min(b.length-1,Math.floor(b.length*f))]; return {n:b.length,med:q(.5),p90:q(.9),max:b[b.length-1]}; }
function sendLag(){
  if(FF||ONL.spec||ONL.me<0||!G) return;
  const c=navigator.connection||{};
  post(`lag.${ONL.g}.${G.handNo}.${ONL.me}`,{s:ONL.me,up:stats(LAG.up),dn:stats(LAG.dn),net:c.effectiveType||'',rtt:c.rtt||0,app:appKind(),v:2});
  LAG.up=LAG.up.slice(-6); LAG.dn=[];
}
let srvOk=null;
async function srvUp(){
  if(srvOk!==null) return srvOk;
  try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),3500);
    const r=await fetch(SRV_URL,{signal:c.signal}); clearTimeout(t); srvOk=r.ok&&!!(await r.json()).ok; }
  catch(e){ srvOk=false; }
  setTimeout(()=>{srvOk=null;},60e3); return srvOk;
}
let warmAt=0;
function srvWarm(force){ if(!force&&Date.now()-warmAt<180e3) return; warmAt=Date.now(); fetch(SRV_URL).catch(()=>{}); }
function iLead(){return [0,1,2,3].find(a=>ONL.seats[a]&&!ONL.gone.has(a))===ONL.me;}
function srvAsk(id,delay,lead){
  if(!ONL.srv||ONL.spec||ONL.me<0) return Promise.resolve(false);
  const tok=ONL.tok, code=ONL.code; let tries=0;
  return new Promise(done=>{
    const go=async()=>{
      if(tok!==ONL.tok||ONL.code!==code) return done(false);
      if(ONL.ev[id]) return done(true);
      try{
        const t=await FB.auth.currentUser.getIdToken();
        const r=await fetch(SRV_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({code,id})}).then(x=>x.json());
        if(r.wait&&!ONL.ev[id]) return setTimeout(go,Math.min(r.wait+150,20000));
        if(r.ok||r.done) return done(true);
        if(++tries<10&&r.err!=='not now'&&r.err!=='not seated'&&r.err!=='no') return setTimeout(go,Math.min(1500*tries,6000));
        done(false);
      }catch(e){ console.warn('srv',e); if(++tries<10) setTimeout(go,Math.min(1500*tries,6000)); else done(false); }
    };
    setTimeout(go,(delay||0)+(lead===false||lead&&!iLead()?2500:0));
  });
}
function waitFor(id,cb){
  const tok=ONL.tok; ONL.wait=null;
  if(ONL.ev[id]){const d=ONL.ev[id]; setTimeout(()=>{if(tok===ONL.tok)cb(d);},0); return;}
  ONL.wait={id,cb,tok}; ffEnd();
}
function ffEnd(){
  if(!FF||!ONL.evReady) return; FF=false; soundOn=ONL.snd;
  if(G&&ONL.on){renderSeats(); renderHand(); if(!ONL.spec) toast('You’re back in. It’s live now.',2200); if(ONL.dropped) postBack();}
}
function turnMs(){ /* time left on the current turn, by the table's clock */
  if(!ONL.on||!ONL.lastAt) return TURN_MS;
  return Math.max(3000,Math.min(TURN_MS,TURN_MS-(Date.now()+(ONL.skew||0)-ONL.lastAt)));
}
function evClock(id,d){
  if(d&&d.at&&d.at.toMillis&&/\.(deal|b\d|p\d+)$/.test(id)){ const at=d.at.toMillis(); ONL.lastAt=Math.max(ONL.lastAt||0,at);
    const t0=ONL.sentAt&&ONL.sentAt[id]; if(t0) ONL.skew=at-(t0+(Date.now()-t0)/2);
    else if(!FF&&ONL.skew!=null&&d.by!==(FB&&FB.uid)&&!d.local){ const lag=Date.now()+ONL.skew-at; if(lag>-500&&lag<60000) LAG.dn.push(Math.max(0,Math.round(lag))); } }
}
function onEv(id,d){
  if(id.startsWith('lag.')) return;
  evClock(id,d);
  if(d&&typeof d.ms==='number'&&typeof d.s==='number'&&d.s!==ONL.me&&!FF){ LAG.seat[d.s]=d.ms; }
  if(!FF&&/\.p51$/.test(id)) setTimeout(sendLag,1500);
  if(ONL.host&&typeof d.s==='number'&&ONL.seats[d.s]&&d.by===ONL.seats[d.s].uid) ONL.miss[d.s]=0;
  if(id.startsWith('c.')) return chatIn(d);
  if(id.startsWith('t.')) return throwIn(d);
  ONL.lastEv=Date.now();
  if(id.startsWith('left.')) return leftIn(d.s,d);
  if(id.startsWith('back.')) return backIn(d.s);
  if(/\.k\d$/.test(id)){ if(G&&id.startsWith(`${ONL.g}.${G.handNo}.`)&&[0,1,2,3].includes(d.s)&&!FF){const p=toL(d.s); if(p!==0){markTracker(p); toast(`🤓 ${nmOf(p)} paid for the card tracker. Newbie!`,2600);} } return; }
  if(ONL.handWait) ONL.handWait();
  if(ONL.watch) ONL.watch(id,d);
  if(ONL.watchDeal&&id===ONL.watchDeal[0]){const f=ONL.watchDeal[1]; ONL.watchDeal=null; f();}
  if(ONL.wait&&ONL.wait.id===id){const w=ONL.wait; ONL.wait=null; clearTimeout(ONL.fbT); setTimeout(()=>{if(w.tok===ONL.tok)w.cb(d);},0); return;}
  /* someone called blind nil before their turn came up */
  if(G&&G.phase==='bid'&&d.blind&&id.startsWith(`${ONL.g}.${G.handNo}.b`)){
    const p=toL(d.s); if(G.bids[p]===null){G.bids[p]=0;G.blind[p]=true;renderSeats();say(p,pick(VOTE_LINES.go),2200,true);snap(0.3,1400);}
  }
}
function throwIn(d){
  if(FF||!G||d.s===ONL.me&&!ONL.spec) return;
  if(![0,1,2,3].includes(d.s)||![0,1,2,3].includes(d.to)||!GIFTS.some(t=>t.k===d.k)) return;
  const f=toL(d.s); if(MUTED.has(f)||(PROFILE.blocked||[]).includes(NAMES[f])) return;
  throwAt(f,toL(d.to),d.k);
}
function chatIn(d){
  const ok=QUICK.concat(QUICK_EXTRA); if(typeof d.s!=='number'||!ok.includes(d.t)) return;
  say(toL(d.s),d.t,2800,true); if(d.s!==ONL.me) cardTap(0.25);
}
function leftIn(a,d){
  if(typeof a!=='number') return;
  ONL.leftN[a]=(ONL.leftN[a]||0)+1;
  if(ONL.gone.has(a)) return;
  ONL.gone.add(a); ONL.goneG[a]=ONL.g;
  if(!ONL.on) return;
  const quit=!!(d&&d.q), bye=!!(d&&d.bye);
  if(bye) ONL.bye.add(a); else ONL.bye.delete(a);
  if(a===ONL.me&&!ONL.spec){ if(quit||bye) return; /* we left on purpose */
    ONL.dropped=true; onlineNames();
    if(!FF){ if(Date.now()-(ONL.rejoinAt||0)<180e3) postBack(); else droppedBar(); }
    return; }
  const p=toL(a); toast(quit?`${NAMES[p]} quit. A bot plays their seat now.`:bye?`${NAMES[p]} left the table.${G&&!G.over?' A bot plays their seat now.':''}`:`${NAMES[p]} lost connection. A bot plays for them until they’re back.`,3400);
  if(quit&&!FF&&!ONL.srv&&ONL.table&&ONL.seats[a]&&ONL.table.host===ONL.seats[a].uid){ const tk=ONL.tok;
    setTimeout(()=>{ if(tk!==ONL.tok||!ONL.on||ONL.host) return; if(ONL.table&&ONL.seats[a]&&ONL.table.host!==ONL.seats[a].uid) return;
      toast('The host left and the table couldn’t continue. No penalty for you.',4200); onlineLeave(false); openLobby(); },8000); }
  onlineNames();
  if(ONL.host&&ONL.drv&&toA(ONL.drv[1])===a) drive(...ONL.drv);

function backIn(a){
  if(typeof a!=='number') return;
  ONL.backN[a]=(ONL.backN[a]||0)+1;
  if(!ONL.gone.has(a)) return;
  ONL.gone.delete(a); ONL.miss[a]=0;
  if(!ONL.on) return;
  if(a===ONL.me){ONL.dropped=false; const b=document.getElementById('dropBar'); if(b) b.remove(); if(!FF) toast('You’re back in your seat.',2200); onlineNames(); renderHand(); return;}
  onlineNames(); if(!FF) toast(`${NAMES[toL(a)]} is back.`,2200);

function droppedBar(){
  if(document.getElementById('dropBar')) return;
  const b=document.createElement('div'); b.id='dropBar'; b.className='invban';
  b.innerHTML='<span>⏸️</span><div>You missed 3 turns, so a bot is playing your seat.</div><button class="btn sm" id="dbBack">I’m back</button>';
  document.body.appendChild(b);

function postBack(){

/* host plays bots right away, and covers a real player after they run out of time */
function drive(kind,p,id){
  if(ONL.srv){ const a=toA(p); if(a===ONL.me||ONL.spec) return; const bot=oBot(a);
    srvAsk(id,bot?(reduce?100:1400):TURN_MS+GRACE+1200,bot); return; }
  if(!ONL.host||ONL.spec) return; clearTimeout(ONL.fbT); const a=toA(p); if(a===ONL.me) return;
  ONL.drv=[kind,p,id];
  const bot=oBot(a), tok=ONL.tok;

    if(tok!==ONL.tok||ONL.ev[id]||!G) return;
    if(!bot){ ONL.miss[a]=(ONL.miss[a]||0)+1; if(ONL.miss[a]>=3){post(`left.${ONL.g}.${a}.${ONL.leftN[a]||0}`,{s:a,q:0});} }

  };
  ONL.fbT=setTimeout(auto, bot?(reduce?120:650+Math.random()*450):(ONL.miss[a]>=1&&opts.timer?TURN_MS+1500:(opts.timer?TURN_MS+8000:120000)));
}

function onlineDeal(){
  const tok=ONL.tok, H=G.handNo+1, did=`${ONL.g}.${H}.deal`;
  status('Shuffling…');
  if(ONL.host&&!ONL.srv&&!ONL.ev[did]){
    dealHand();
    const {F,db}=FB, b=F.writeBatch(db);
    for(let a=0;a<4;a++) b.set(F.doc(db,'tables',ONL.code,'hands',`${ONL.g}-${H}-${a}`),{uid:oBot(a)||a===ONL.me?FB.uid:ONL.seats[a].uid,cards:G.hands[toL(a)].map(c=>c.id)});
    b.commit().then(()=>post(did,{s:ONL.me,d:toA(G.dealer)})).then(ok=>{
      if(tok!==ONL.tok) return; if(!ok){toast('Connection problem. Check your internet.',3000);return;}
      ONL.dealt=true; startHand();
    }).catch(e=>{console.warn(e);toast('Connection problem. Check your internet.',3000);});
    return;
  }
  const go=()=>{
    if(tok!==ONL.tok) return true;
    const ev=ONL.ev[did], key=a=>`${ONL.g}-${H}-${a}`;
    if(!ev) return false;
    (ev.join||[]).forEach(a=>{ if(!ONL.seats[a]&&ONL.seatDocs&&ONL.seatDocs[a]){ ONL.seats[a]=ONL.seatDocs[a]; if(!FF&&a!==ONL.joinSeat) toast(`${ONL.seatDocs[a].name} joined and takes over this seat.`,2600); }
      if(a===ONL.joinSeat){ ONL.spec=false; ONL.joinSeat=-1; specTag(); if(!FF) toast('You’re in. This hand is yours. Good luck!',2600); } });
    if(ev.join&&ev.join.length) onlineNames();
    /* rejoining after taking over a bot's seat: hands before that were the bot's */
    const lateJoin=!ONL.spec&&Object.keys(ONL.ev).some(k=>{const m=k.match(/^(\d+)\.(\d+)\.deal$/); return m&&+m[1]===ONL.g&&+m[2]>H&&(ONL.ev[k].join||[]).includes(ONL.me);});
    const need=ONL.spec||lateJoin?[]:[ONL.me].concat(ONL.host&&!ONL.srv?[0,1,2,3].filter(a=>a!==ONL.me&&oBot(a)):[]);
    if(need.some(a=>!ONL.myHands[key(a)])) return false;
    ONL.handWait=null;
    G.deck=makeDeck(); const byId=Object.fromEntries(G.deck.map(c=>[c.id,c]));
    const ph=()=>Array.from({length:13},(_,i)=>({id:'?'+i,s:'?',r:0}));
    G.hands=[0,1,2,3].map(p=>{const c=ONL.myHands[key(toA(p))]; return c?sortHand(c.map(id=>byId[id]).filter(Boolean)):ph();});
    G.bids=[null,null,null,null]; G.tricks=[0,0,0,0]; G.trick=[]; G.broken=false; G.played=new Set(); G.lastTrick=null;
    G.blind=[false,false,false,false]; G.hideHand=false; G.handNo=H; G.dealer=toL(ev.d);
    ONL.dealt=true; startHand(); return true;
  };
  if(!go()){ONL.handWait=go; if(!ONL.ev[did]){ ffEnd(); if(ONL.srv) srvAsk(did,0,true); }}
}

<script id="social">
/* ===== Usernames, sign-in, friends, invites, randoms, player ratings ===== */
/* Flip these on once each sign-in is set up in the Firebase console (Authentication → Sign-in method). */
const SOCIAL={apple:false,facebook:false};
const NAME_RX=/^[A-Za-z0-9_]{3,14}$/;
const NAME_BAD=/fuck|shit|bitch|cunt|nigg|fag|dick|pussy|whore|slut|rape|nazi|hitler|retard|cock|porn|admin|moderator|bagsandbooks/i;
const RND_RULES={jokers:false,deuce:false,nil:true,bags:true,timer:true,blind:false,teamBid:false};

const SOC={inv:null,seen:new Set(),started:false};
const RCACHE={};
let namedQ=[];

function needsName(){return !PROFILE.handle;}
function previewNote(){ /* the Claude app's preview can't reach the online server */
  const v=sheet(`<h2>Online play</h2><p class="lede">Online games, usernames and friends don’t work inside this preview. Open the real game to play online:</p>
    <p style="text-align:center;font-weight:800;font-size:17px;margin:10px 0">mcombizz.com/bags-and-books/play</p>

  v.querySelector('#pvCopy').onclick=()=>copyText('https://mcombizz.com/bags-and-books/play/');

}
function whenNamed(f){ if(PREVIEW){ previewNote(); return; } if(!needsName()) return f(); namedQ.push(f); if(!document.getElementById('onb')) onboard(); }
function runNamedQ(){const q=namedQ; namedQ=[]; q.forEach(f=>{try{f();}catch(e){console.warn(e);}});}

/* ---------- first launch: pick a username (or sign in) ---------- */
function onboard(change){
  const pre=PROFILE.handle||(PROFILE.name&&PROFILE.name!=='You'?PROFILE.name.replace(/[^A-Za-z0-9_]/g,'').slice(0,14):'');
  const sso=(SOCIAL.apple||SOCIAL.facebook)&&!change;
  const v=sheet(`<div id="onb">
    ${change?'':'<div class="onb-hero"><span>♠</span></div>'}
    <h2>${change?'Change your username':'Welcome to Bags &amp; Books'}</h2>
    <p class="lede">${change?'Friends find and invite you by this name.':'Pick a username. It’s how your friends find you, invite you to tables and see you play.'}</p>
    <div class="onb-in"><span>@</span><input id="oName" class="nameIn" maxlength="14" placeholder="username" autocomplete="nickname" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(pre)}" aria-label="Username"></div>
    <div class="onb-hint" id="oHint">3 to 14 letters, numbers or _</div>

    ${sso?`<div class="onb-or"><span>or save your coins and level on every device</span></div>
      ${SOCIAL.apple?'<button class="btn sso apple" id="oApple"><b></b> Continue with Apple</button>':''}
      ${SOCIAL.facebook?'<button class="btn sso fb" id="oFb"><b>f</b> Continue with Facebook</button>':''}`:''}
    ${change?'':'<button class="btn ghost" id="oLater">Play offline for now</button>'}
    <p class="fine">Keep it friendly. Names that break the rules get changed.</p></div>`,{mid:true,noClose:!change});
  const inp=v.querySelector('#oName'), hint=v.querySelector('#oHint'), go=v.querySelector('#oGo');

async function claimName(n){
  if(!NAME_RX.test(n)) return 'Use 3 to 14 letters, numbers or _ (no spaces).';
  if(NAME_BAD.test(n)) return 'Pick a different name.';
  if(!await connect(true)) return PREVIEW?'Usernames work in the app and at mcombizz.com, not in this preview.':'Couldn’t reach the server. Check your internet.';
  const {F,db}=FB, low=n.toLowerCase(), ref=F.doc(db,'names',low);
  try{
    const s=await F.getDoc(ref);
    if(s.exists()&&s.data().uid!==FB.uid) return `@${n} is taken. Try another.`;
    if(!s.exists()) await F.setDoc(ref,{uid:FB.uid,n,at:F.serverTimestamp()});
    const old=PROFILE.handle; if(old&&old.toLowerCase()!==low) F.deleteDoc(F.doc(db,'names',old.toLowerCase())).catch(()=>{});
    F.setDoc(F.doc(db,'users',FB.uid),{n,av:cleanAv(PROFILE.av),at:F.serverTimestamp()}).catch(e=>console.warn(e));
    PROFILE.handle=n; PROFILE.name=n; saveProfile(); renderMe(); return '';
  }catch(e){console.warn(e); return e&&e.code==='permission-denied'?`@${n} is taken. Try another.`:'Couldn’t save that. Try again.';}

  }catch(e){console.warn(e);}
  listenInvites(); presence();
}

/* ---------- Sign in with Apple / Facebook (keeps the same player id, so name, friends and ratings carry over) ---------- */
async function ssoStart(kind,v){
  if(!await connect()) return;

      try{ await U.signInWithCredential(auth,P.credentialFromError(e)); FB.uid=auth.currentUser.uid; await cloudLoad(); }
      catch(e2){console.warn(e2); toast('Sign-in didn’t finish. Try again.',2600); return;}
    } else { console.warn(e); toast('Sign-in didn’t finish. Try again.',2600); return; }
  }

async function findMatch(mode){
  if(!await connect()) return false;
  try{
    for(const t of await openPub(mode)) if(await trySit(t.code)) return true;
    for(const t of await openLive(mode)) if(await joinLive(t)) return true;
    return await createTable(mode,mode==='ffa'?100:300,true);
  }catch(e){console.warn(e); toast('Couldn’t find a table. Try again.',2600); return false;}
}
async function openPub(mode,skip){
  const {F,db}=FB, now=Date.now(), out=[];
  const s=await F.getDocs(F.query(F.collection(db,'tables'),F.where('pub','==',true),F.where('status','==','lobby'),F.where('mode','==',mode),F.limit(25)));
  const ms=x=>x&&x.toMillis?x.toMillis():0;
  s.forEach(d=>{const x=d.data(); if(d.id!==skip&&x.host!==FB.uid&&now-ms(x.ping)<45e3) out.push({code:d.id,created:ms(x.created)||now});});
  return out.sort((a,b)=>a.created-b.created||(a.code<b.code?-1:1));
}
/* games already being played that still have a bot in them (server-run tables only) */
async function openLive(mode){
  const {F,db}=FB, now=Date.now(), out=[], ms=x=>x&&x.toMillis?x.toMillis():0;
  const s=await F.getDocs(F.query(F.collection(db,'tables'),F.where('pub','==',true),F.where('status','==','playing'),F.where('mode','==',mode),F.limit(25)));
  s.forEach(d=>{const x=d.data(); if(x.srv&&(x.bots||[]).length&&now-ms(x.act||x.created)<6*60e3&&x.host!==FB.uid) out.push({code:d.id,bots:x.bots.slice(),act:ms(x.act)});});

}

async function trySit(code,before){

/* ---------- quitting ----------
   Leaving mid-game = a quit: an automatic 1-star and a timeout from Play Online.
   Losing connection is not a quit if you come back before the game ends (a bot covers your seat meanwhile).
   No penalty if your partner already left, or if the host's connection died and the table froze. */
function gameLive(){return !!(ONL.on&&!ONL.spec&&G&&!G.over&&(G.phase==='bid'||G.phase==='play'||G.phase==='between'||G.phase==='idle'));}
function stalled(){return !ONL.srv&&Date.now()-(ONL.lastEv||Date.now())>45e3;}
function partnerGone(){return partnersOn()&&ONL.gone.has((ONL.me+2)%4);}
function aloneNow(){return ![0,1,2,3].some(a=>a!==ONL.me&&ONL.seats[a]&&!ONL.gone.has(a));}
function quitCounts(){return gameLive()&&!stalled()&&!partnerGone()&&!aloneNow();}
function leaveGame(){
  if(!quitCounts()){ onlineLeave(true,false); openLobby(); return; }
  const t=quitTimeoutFor(Date.now(),1);
  const v=sheet(`<h2>Leave this game?</h2>
    <p class="lede">Leaving before the game ends counts as a <b>quit</b>. You get an automatic <b>1-star</b> rating and a <b>${fmtDur(t).replace(/ (minute|hour)s?$/,'-$1')}</b> timeout from Play Online. A bot takes your seat.</p>
    <ul class="notes"><li>Lost connection? That’s not a quit. Open the app again before the game ends and you get your seat back.</li><li>If your partner leaves first, you can go with no penalty.</li></ul>
    <button class="btn" id="qStay">Stay and finish</button><button class="btn ghost warn" id="qGo">Leave anyway</button>`,{mid:true});
  v.querySelector('#qStay').onclick=()=>v.remove();
  v.querySelector('#qGo').onclick=()=>{v.remove(); noteQuit(); onlineLeave(true,true); openLobby(); toast(`You left the game. Play Online opens again in ${fmtDur(t)}.`,3600);};
}
function noteQuit(){const q=(PROFILE.quits||[]).filter(t=>Date.now()-t<864e5); q.push(Date.now()); PROFILE.quits=q.slice(-10); saveProfile();}
const QUIT_STEPS=[5,15,60]; // minutes: 1st, 2nd, 3rd+ quit in 24 hours
function quitTimeoutFor(now,extra){
  const n=(PROFILE.quits||[]).filter(t=>now-t<864e5).length+(extra||0);
  return n?QUIT_STEPS[Math.min(n,QUIT_STEPS.length)-1]*60e3:0;
}
function quitWait(r){
  const now=Date.now();
  (r&&r.qAt||[]).forEach(t=>{if(!(PROFILE.quits||[]).some(x=>Math.abs(x-t)<5*60e3)) PROFILE.quits=(PROFILE.quits||[]).concat(t);});
  const q=(PROFILE.quits||[]).filter(t=>now-t<864e5).sort((a,b)=>a-b); if(!q.length) return 0;
  const dur=QUIT_STEPS[Math.min(q.length,QUIT_STEPS.length)-1]*60e3;
  return Math.max(0,q[q.length-1]+dur-now);
}
function fmtDur(ms){const m=Math.ceil(ms/60e3); return m>=60?`${Math.round(m/60)} hour${m>=120?'s':''}`:`${m} minute${m>1?'s':''}`;}
/* at game over, anyone still at the table files the 1-star for each quit (first write wins, so it only counts once) */
function quitRatings(){
  if(ONL.spec||!FB) return;
  const {F,db}=FB;
  for(let a=0;a<4;a++){ const s=ONL.seats[a]; if(!s||a===ONL.me||s.uid===FB.uid) continue;
    const mk=`${ONL.g}.q${a}`;
    const file=()=>F.setDoc(F.doc(db,'users',s.uid,'rates',`q_${ONL.code}_${ONL.g}`),{from:FB.uid,stars:1,at:F.serverTimestamp(),code:ONL.code,g:ONL.g,fs:ONL.me,ts:a}).then(()=>{delete RCACHE[s.uid];}).catch(()=>{});
    if(ONL.ev[mk]) file();
    else if(ONL.srv&&ONL.gone.has(a)&&ONL.goneG[a]===ONL.g&&!ONL.bye.has(a)) srvAsk(mk,0,true).then(ok=>{if(ok) file();});
    else if(ONL.host&&!ONL.srv&&ONL.gone.has(a)&&ONL.goneG[a]===ONL.g&&!ONL.bye.has(a)) post(mk,{s:a,drop:1}).then(ok=>{if(ok) file();}); /* dropped and never came back */
  }
}

/* ---------- host hand-off: if the host leaves, the next player runs the table ---------- */
function handHost(a){
  const s=ONL.seats[a]; if(!s||!FB) return Promise.resolve();
  /* grab everything now: the leave clears the table state right after this call */
  const {F,db}=FB, code=ONL.code, g=ONL.g, H=G?G.handNo:0, copies=[];
  if(G&&!ONL.srv&&(G.phase==='bid'||G.phase==='play')) for(let x=0;x<4;x++){ if(x===a) continue;
    const cards=(G.hands[toL(x)]||[]).filter(c=>c&&c.s!=='?'&&!G.played.has(c.id)).map(c=>c.id);
    if(cards.length) copies.push([x,cards]); }
  const b=F.writeBatch(db);
  copies.forEach(([x,cards])=>b.set(F.doc(db,'tables',code,'hands',`${g}-${H}-${x}-x`),{uid:s.uid,cards}));
  return b.commit().then(()=>F.updateDoc(F.doc(db,'tables',code),{host:s.uid,hs:a})).catch(e=>console.warn('handoff',e));
}
function takeHost(){
  ONL.host=true;
  if(ONL.srv){ toast('The host left. You can run it back when the game ends.',3000); return; }
  toast('The host left. Your phone runs the table now.',3200);
  const tok=ONL.tok, start=Date.now();
  const go=()=>{
    if(tok!==ONL.tok||!ONL.on) return;
    const key=a=>`${ONL.g}-${G.handNo}-${a}`, need=[0,1,2,3].filter(a=>a!==ONL.me&&(G.phase==='bid'||G.phase==='play'));
    if(need.some(a=>!ONL.myHands[key(a)])&&Date.now()-start<4000) return setTimeout(go,300);
    const byId=Object.fromEntries((G.deck||[]).map(c=>[c.id,c]));
    need.forEach(a=>{const c=ONL.myHands[key(a)]; if(c) G.hands[toL(a)]=sortHand(c.filter(id=>!G.played.has(id)).map(id=>byId[id]).filter(Boolean));});
    const w=ONL.wait&&ONL.wait.id;
    if(w){ const mb=w.match(/\.b(\d)$/); if(mb) drive('b',toL(+mb[1]),w); else if(/\.p\d+$/.test(w)) drive('p',G.turn,w); }
    if(ONL.watchDeal){ const f=ONL.watchDeal[1]; setTimeout(()=>{if(ONL.watchDeal&&ONL.watchDeal[1]===f){ONL.watchDeal=null; f();}},2500); }
  };
  go();
}

/* ---------- player ratings: 1 to 5 stars, average of the last 50 games you were rated in ---------- */
async function ratingOf(uid){
  const c=RCACHE[uid]; if(c&&(c.p||Date.now()-c.t<300e3)) return c.p||c;
  if(!FB) return null;
  const {F,db}=FB;
  const p=F.getDocs(F.query(F.collection(db,'users',uid,'rates'),F.orderBy('at','desc'),F.limit(50))).then(s=>{
    let sum=0,n=0,q=0; const qAt=[]; s.forEach(d=>{const x=d.data().stars; if(Number.isInteger(x)&&x>=1&&x<=5){sum+=x;n++;}
      if(d.id.startsWith('q_')){q++; const t=d.data().at; if(t&&t.toMillis) qAt.push(t.toMillis());}});
    return RCACHE[uid]={avg:n?sum/n:0,n,q,qAt,t:Date.now()};
  }).catch(e=>{console.warn(e); delete RCACHE[uid]; return null;});
  RCACHE[uid]={p}; return p;
}
function starRow(avg){const f=Math.round(avg*2)/2; return [1,2,3,4,5].map(i=>`<i class="${f>=i?'f':f>=i-.5?'h':''}">★</i>`).join('');}
function rtHtml(r,long){
  if(!r||r.p) return '';
  if(r.n<3) return `<span class="rt new">${long?'New player · not enough ratings yet':'New'}</span>`;
  return `<span class="rt">${long?starRow(r.avg)+' ':'★ '}${r.avg.toFixed(1)}${long?` <small>from ${r.n} recent rating${r.n>1?'s':''}${r.q?` · quit ${r.q} game${r.q>1?'s':''}`:''}</small>`:''}</span>`;
}
function rtTag(uid,long){
  if(!uid||!FB) return '';
  const c=RCACHE[uid]; if(c&&!c.p) return `<span class="rtslot">${rtHtml(c,long)}</span>`;
  ratingOf(uid).then(r=>{document.querySelectorAll(`.rtslot[data-u="${uid}"]`).forEach(el=>{el.innerHTML=rtHtml(r,el.dataset.l==='1');});});
  return `<span class="rtslot" data-u="${esc(uid)}" data-l="${long?1:0}"></span>`;
}

function rateBlock(v,nx){
  if(ONL.spec||!FB) return;
  const others=[0,1,2,3].filter(a=>a!==ONL.me&&ONL.seats[a]&&ONL.seats[a].uid!==FB.uid);
  if(!others.length) return;
  const picked={};
  const el=document.createElement('div'); el.className='ratebox';
  el.innerHTML=`<h4>Rate the table <small>optional · anonymous</small></h4>`+others.map(a=>{const s=ONL.seats[a], fr=friendsList().some(f=>f.uid===s.uid);
      return `<div class="rrow" data-a="${a}"><div class="mini">${avatarSVG(s.av)}</div><div class="rn"><b>${esc(s.name)}</b>${ONL.gone.has(a)?(ONL.ev[`${ONL.g}.q${a}`]&&!ONL.ev[`${ONL.g}.q${a}`].drop?'<em>quit</em>':ONL.bye.has(a)?'<em>left</em>':'<em>lost connection</em>'):(partnersOn()&&a%2===ONL.me%2?'<em>partner</em>':'')}</div>
        <div class="stars">${[1,2,3,4,5].map(k=>`<button data-k="${k}" aria-label="${k} star${k>1?'s':''}">★</button>`).join('')}</div>
        ${fr?'':`<button class="addf" data-a="${a}" aria-label="Add ${esc(s.name)} as a friend">＋</button>`}</div>`;}).join('')+
    `<button class="btn ghost sm" id="rateSend" disabled>Send ratings</button>`;
  const top=v.querySelector('.sheet .lede'); if(top) top.after(el); else nx.before(el);
  el.querySelectorAll('.rrow').forEach(r=>r.querySelectorAll('.stars button').forEach(b=>b.onclick=()=>{
    const a=+r.dataset.a, k=+b.dataset.k; picked[a]=k; audio(); snap(0.2,800+k*250);
    r.querySelectorAll('.stars button').forEach(x=>x.classList.toggle('on',+x.dataset.k<=k));
    el.querySelector('#rateSend').disabled=false;}));
  el.querySelectorAll('.addf').forEach(b=>b.onclick=()=>{addFriendSeat(ONL.seats[+b.dataset.a]); b.textContent='✓'; b.disabled=true;});
  const send=el.querySelector('#rateSend');
  send.onclick=async()=>{send.disabled=true; send.textContent='Sending…';
    const res=await Promise.all(Object.entries(picked).map(([a,k])=>sendRate(+a,k)));
    el.querySelectorAll('.stars button').forEach(b=>b.disabled=true);
    send.textContent=res.every(Boolean)?'Thanks. Ratings sent ✓':'Some ratings didn’t send';};
}
async function sendRate(a,k){
  const s=ONL.seats[a]; if(!s||!FB) return false; const {F,db}=FB;
  try{ await F.setDoc(F.doc(db,'users',s.uid,'rates',`${FB.uid}_${ONL.code}_${ONL.g}`),{from:FB.uid,stars:k,at:F.serverTimestamp(),code:ONL.code,g:ONL.g,fs:ONL.me,ts:a});
    delete RCACHE[s.uid]; return true; }
  catch(e){ console.warn(e); return false; }
}
/* practice games: the bots grade how you played (kept separate from your real player rating) */
function botGrade(won){
  const gr=G.gr||{ok:0,bad:0,pen:0}, h=(gr.ok+gr.bad)||1;
  let s=1+4*gr.ok/h-gr.pen*0.5+(won?0.5:0); s=Math.max(1,Math.min(5,Math.round(s)));
  const pr=PROFILE.botRates||[]; pr.push(s); PROFILE.botRates=pr.slice(-50);
  const by=partnersOn()?NAMES[2]:NAMES[oppSeat()];
  const why=s>=5?'Clean game. Bids made and no wasted books.':s>=4?'Solid. Just a slip or two.':s>=3?'Some sets cost you. Tighten up those bids.':'Rough one. Count your sure books before you bid.';
  return `<div class="grade"><div><b>${esc(String(by).replace(' 🤖',''))}</b> rated your play</div><div class="gstars">${starRow(s)}</div><small>${why} Practice stars stay private. Real players rate you online.</small></div>`;
}

/* boot */
setTimeout(()=>{
  if(/[?&#]fresh/.test(location.href)) return;
  if(PREVIEW) return; /* no online server in the preview, so don't ask for a username here */
  if(needsName()){ if(PROFILE.skipOnb!==todayKey()) connect(true).then(ok=>{ if(ok&&needsName()&&!document.querySelector('.veil')) onboard(); }); }
  else startSocial();
},400);
</script>
